<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<meta name="referrer" content="no-referrer" />
<title>Lunar OS</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--glass:rgba(12,20,32,.62);--solid:rgba(11,18,28,.94);--line:rgba(255,255,255,.09);--line2:rgba(255,255,255,.2);
  --ink:#eef4fa;--mut:#8ea4b8;--acc:#8cc8f0;--soft:rgba(255,255,255,.08);--ease:cubic-bezier(.22,1,.36,1);--shelf:64px}
html,body{width:100%;height:100%;overflow:hidden;background:#03070c;color:var(--ink);font-family:'Inter','SF Pro Display','Segoe UI',system-ui,sans-serif;-webkit-font-smoothing:antialiased;user-select:none}
button,input{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
#vanta,#wall{position:fixed;inset:0;z-index:0}#vanta{background:radial-gradient(at 30% 20%,#1d4262,#07111c 70%)}#wall{background-size:cover;background-position:center;transition:opacity .6s}
#nl,#dim{position:fixed;inset:0;z-index:999;pointer-events:none;transition:opacity .4s}
#nl{background:rgba(255,140,40,.16);mix-blend-mode:multiply;opacity:0}#dim{background:#000;opacity:0}
.glass{background:var(--glass);backdrop-filter:blur(28px) saturate(1.5);-webkit-backdrop-filter:blur(28px) saturate(1.5);border:1px solid var(--line);box-shadow:0 20px 50px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.06)}

/* lock + setup */
#lock{position:fixed;inset:0;z-index:500;display:grid;place-items:center;text-align:center;cursor:pointer;background:rgba(3,8,14,.25);backdrop-filter:blur(2px);
  transition:transform .8s var(--ease),opacity .6s,backdrop-filter .8s}
#lock.gone{transform:translateY(-100%);opacity:0;pointer-events:none;backdrop-filter:blur(0)}
#lock.blur{backdrop-filter:blur(26px) brightness(.7)}
.lk{display:grid;gap:6px;justify-items:center;transition:opacity .35s,transform .5s var(--ease)}.blur .lk{opacity:0;transform:scale(.96);pointer-events:none}
.lk small{letter-spacing:.5em;font-size:.72rem;color:var(--acc);font-weight:600;margin-bottom:14px}
#lT{font-size:clamp(4.5rem,13vw,9rem);font-weight:200;letter-spacing:-.04em;line-height:1;text-shadow:0 4px 40px rgba(0,0,0,.4)}
#lD{font-size:1.05rem;color:#cfe0ee;margin-bottom:34px}
.hint{font-size:.8rem;color:#b5c9da;animation:breathe 2.6s ease-in-out infinite}@keyframes breathe{50%{opacity:.35}}
.skip{position:absolute;right:28px;bottom:26px;padding:8px 16px;border-radius:999px;font-size:.78rem;color:var(--mut)}.skip:hover{background:var(--soft);color:var(--ink)}
#setup{position:absolute;width:min(400px,90vw);padding:32px;border-radius:24px;display:grid;gap:14px;text-align:left;cursor:default;opacity:0;pointer-events:none;transform:translateY(16px) scale(.97);transition:.5s var(--ease)}
.blur #setup{opacity:1;pointer-events:auto;transform:none}
#setup h2{font-weight:500;font-size:1.5rem;letter-spacing:-.02em}#setup p{color:var(--mut);font-size:.88rem;margin-top:-6px}
.fld{height:46px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.28);outline:0;transition:border-color .2s,box-shadow .2s;user-select:text;width:100%}
.fld:focus{border-color:var(--acc);box-shadow:0 0 0 4px rgba(140,200,240,.15)}
.btn{height:42px;padding:0 20px;border-radius:12px;background:var(--soft);font-size:.86rem;transition:.2s}.btn:hover{background:rgba(255,255,255,.14)}
.btn.p{background:var(--ink);color:#07111a;font-weight:600}.btn.p:hover{background:#fff;transform:translateY(-1px)}
.mini{display:flex;gap:8px}.mini div{flex:1;height:52px;border-radius:10px;border:2px solid transparent;background-size:cover;cursor:pointer;transition:.2s}.mini div:hover{transform:translateY(-2px)}.mini .on{border-color:var(--ink)}

/* desktop */
#desk{position:fixed;inset:0 0 var(--shelf) 0;z-index:2;padding:26px 22px;overflow:auto}
#grid{display:grid;grid-template-columns:repeat(auto-fill,96px);grid-auto-rows:108px;gap:6px;align-content:start}
.ic{display:flex;flex-direction:column;align-items:center;gap:7px;padding:10px 4px;border-radius:14px;cursor:pointer;transition:background .2s,transform .2s var(--ease);animation:in .5s var(--ease) both}
.ic:hover{background:var(--soft)}.ic:active{transform:scale(.95)}.ic.drag{opacity:.35}
@keyframes in{from{opacity:0;transform:translateY(10px) scale(.96)}}
.tile{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;font-weight:600;font-size:1.4rem;color:#fff;box-shadow:0 8px 20px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.3),inset 0 -8px 16px rgba(0,0,0,.12)}
.tile{position:relative;overflow:hidden}.tile svg{width:26px;height:26px}
.tile img.fav{position:absolute;inset:0;width:100%;height:100%;padding:17%;background:#fff;object-fit:contain;opacity:0;transition:opacity .3s}
.fv{width:16px;height:16px;border-radius:4px;flex:none;background:#fff;object-fit:contain}
.ab{flex:1;position:relative;display:flex}.ab .fld{padding-left:16px}.ab.has .fld{padding-left:38px}
.afv{position:absolute;left:12px;top:9px;width:16px;height:16px;border-radius:4px;background:#fff;object-fit:contain;display:none}.ab.has .afv{display:block}.ic span{font-size:.74rem;max-width:88px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-shadow:0 1px 10px rgba(0,0,0,.8)}

/* shelf */
#shelf{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);z-index:100;height:54px;padding:0 8px;border-radius:20px;display:flex;align-items:center;gap:4px}
.sb{position:relative;width:42px;height:42px;border-radius:13px;display:grid;place-items:center;transition:transform .25s var(--ease),background .2s}
.sb:hover{background:var(--soft);transform:translateY(-4px) scale(1.08)}.sb:active{transform:scale(.92)}
.sb .tile{width:34px;height:34px;border-radius:10px;box-shadow:none}.sb .tile svg{width:18px;height:18px}
.sb.run::after{content:"";position:absolute;bottom:1px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--ink)}
.sep{width:1px;height:26px;background:var(--line);margin:0 4px}
#tray{position:fixed;right:10px;bottom:10px;z-index:100;height:54px;padding:0 16px;border-radius:20px;display:flex;align-items:center;gap:12px;font-size:.8rem;transition:.2s}
#tray:hover,#tray.on{border-color:var(--line2)}#tray svg{width:17px;height:17px}#tray b{font-weight:500;line-height:1.2;text-align:right}#tray small{display:block;color:var(--mut);font-size:.68rem}

/* windows */
.win{position:fixed;z-index:10;display:flex;flex-direction:column;background:var(--solid);border:1px solid var(--line);border-radius:16px;overflow:hidden;min-width:320px;min-height:200px;
  box-shadow:0 30px 80px rgba(0,0,0,.55);animation:wopen .35s var(--ease);transition:opacity .25s,transform .3s var(--ease),border-color .2s,box-shadow .2s}
.win.focus{border-color:var(--line2);box-shadow:0 40px 100px rgba(0,0,0,.65)}
@keyframes wopen{from{opacity:0;transform:scale(.94) translateY(14px)}}
.win.min,.win.closing{opacity:0;transform:scale(.92) translateY(40px);pointer-events:none}.win.min{visibility:hidden;transition:opacity .25s,transform .3s var(--ease),visibility 0s .3s}
.win.max{inset:0 0 var(--shelf) 0!important;width:auto!important;height:auto!important;border-radius:0}
.tbar{height:42px;display:flex;align-items:center;gap:6px;padding:0 10px 0 16px;cursor:grab;flex:none;background:rgba(255,255,255,.03);border-bottom:1px solid var(--line)}
.ttl{flex:1;font-size:.8rem;color:#c3d3e0;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wb{width:30px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--mut);transition:.15s}.wb svg{width:14px;height:14px}
.wb:hover{background:var(--soft);color:var(--ink)}.wb.x:hover{background:#e5484d;color:#fff}
.wbody{flex:1;position:relative;min-height:0;display:flex;flex-direction:column}.wbody iframe{flex:1;width:100%;border:0;background:#0a1219}
.dragging iframe{pointer-events:none}.dragging{transition:none}
.rz{position:absolute;right:0;bottom:0;width:18px;height:18px;cursor:nwse-resize}
.nav{display:flex;gap:4px;padding:8px;border-bottom:1px solid var(--line)}
.nav .fld{height:34px;border-radius:10px;font-size:.84rem}.nav .wb{height:34px;width:34px}
.empty{flex:1;display:grid;place-items:center;text-align:center;color:var(--mut);font-size:.86rem;line-height:1.6}.empty b{display:block;color:var(--ink);font-size:1.5rem;font-weight:300;margin-bottom:6px}

/* launcher */
#launch{position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;align-items:center;padding:9vh 24px 100px;background:rgba(4,9,16,.55);backdrop-filter:blur(40px) saturate(1.4);
  opacity:0;pointer-events:none;transform:scale(1.04);transition:opacity .3s,transform .4s var(--ease)}
#launch.open{opacity:1;pointer-events:auto;transform:none}
#launch .fld{max-width:440px;text-align:center;height:48px;border-radius:999px;background:rgba(255,255,255,.08)}
#lg{display:grid;grid-template-columns:repeat(auto-fill,110px);gap:10px;justify-content:center;margin-top:44px;width:min(880px,100%);overflow:auto;max-height:100%}
#lg .ic{animation:none}
/* panel */
#panel{position:fixed;right:10px;bottom:76px;width:min(380px,calc(100vw - 20px));max-height:calc(100vh - 100px);overflow:auto;z-index:150;border-radius:24px;padding:16px;display:grid;gap:14px;
  opacity:0;pointer-events:none;transform:translateY(14px) scale(.97);transform-origin:bottom right;transition:.35s var(--ease)}
#panel.open{opacity:1;pointer-events:auto;transform:none}
.qs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.q{display:flex;align-items:center;gap:10px;height:56px;padding:0 14px;border-radius:16px;background:var(--soft);font-size:.82rem;text-align:left;transition:.2s}
.q:hover{background:rgba(255,255,255,.13)}.q.on{background:var(--ink);color:#07111a}.q small{display:block;font-size:.66rem;opacity:.65}
.sl{display:flex;align-items:center;gap:12px;padding:0 4px}.sl b{width:38px;font-size:.74rem;font-weight:500;text-align:right;color:var(--mut)}
input[type=range]{flex:1;-webkit-appearance:none;appearance:none;height:6px;border-radius:9px;background:rgba(255,255,255,.14);outline:0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.4);cursor:pointer}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border:0;border-radius:50%;background:#fff}
.nh{display:flex;justify-content:space-between;align-items:center;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);padding:0 4px}
.nh button{font-size:.74rem;letter-spacing:0;text-transform:none;color:var(--acc);padding:4px 8px;border-radius:8px}.nh button:hover{background:var(--soft)}
.nl{display:grid;gap:8px;max-height:200px;overflow:auto}.nc{padding:11px 14px;border-radius:14px;background:var(--soft);font-size:.82rem;animation:in .4s var(--ease)}.nc small{display:block;color:var(--mut);margin-top:2px}
.none{text-align:center;color:var(--mut);font-size:.8rem;padding:14px}
/* banner + ctx + dialog */
#ban{position:fixed;top:16px;right:16px;z-index:600;display:grid;gap:8px;pointer-events:none}
.bn{padding:12px 18px;border-radius:16px;font-size:.84rem;animation:bin .5s var(--ease);transition:.4s}.bn.out{opacity:0;transform:translateX(30px)}.bn small{display:block;color:var(--mut)}@keyframes bin{from{opacity:0;transform:translateX(40px)}}
#ctx{position:fixed;z-index:300;min-width:200px;padding:6px;border-radius:14px;display:none}
#ctx button{display:block;width:100%;text-align:left;padding:9px 12px;border-radius:9px;font-size:.84rem}#ctx button:hover{background:var(--soft)}#ctx .d:hover{background:#e5484d}
#dlg{position:fixed;inset:0;z-index:400;display:grid;place-items:center;background:rgba(0,0,0,.4);backdrop-filter:blur(8px);opacity:0;pointer-events:none;transition:.3s}#dlg.open{opacity:1;pointer-events:auto}
#card{width:min(400px,90vw);padding:26px;border-radius:22px;display:grid;gap:12px;transform:scale(.95);transition:.4s var(--ease)}.open #card{transform:none}
#card h3{font-weight:500;font-size:1.15rem}.row{display:flex;gap:8px;justify-content:flex-end;margin-top:4px}
.set{padding:22px;overflow:auto;display:grid;gap:14px;align-content:start;font-size:.86rem}
.set h4{font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;color:var(--mut);font-weight:600;margin-top:6px}
.walls{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.wp{height:70px;border-radius:12px;border:2px solid transparent;background-size:cover;background-position:center;display:flex;align-items:flex-end;padding:7px 9px;font-size:.68rem;text-shadow:0 1px 6px #000;cursor:pointer;transition:.2s}
.wp:hover{transform:translateY(-2px)}.wp.on{border-color:var(--ink)}

.tabs{display:flex;align-items:flex-end;gap:4px;padding:6px 8px 0;background:rgba(0,0,0,.28);flex:none}.tabs>.wb{margin-bottom:3px}
.tl{display:flex;gap:2px;flex:1;min-width:0;overflow:hidden}
.tb{display:flex;align-items:center;gap:8px;height:34px;padding:0 6px 0 12px;min-width:0;flex:0 1 210px;border-radius:10px 10px 0 0;font-size:.76rem;color:var(--mut);cursor:pointer;transition:background .2s,color .2s}
.tb:hover{background:var(--soft)}.tb.on{background:var(--solid);color:var(--ink)}.tt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx{width:20px;height:20px;border-radius:6px;display:grid;place-items:center;flex:none;opacity:.6}.tx:hover{background:var(--soft);opacity:1}.tx svg{width:12px;height:12px}
.sp{display:none;width:14px;height:14px;border:2px solid var(--line2);border-top-color:var(--acc);border-radius:50%;animation:spin .7s linear infinite;flex:none}@keyframes spin{to{transform:rotate(360deg)}}
.wb:disabled{opacity:.3;pointer-events:none}.wb.fill svg{fill:#f5c542;stroke:#f5c542}
.prog{height:2px;position:relative;flex:none}.prog i{position:absolute;left:0;top:0;height:100%;width:0;background:var(--acc);opacity:1}
.prog.on i{width:85%;transition:width 6s cubic-bezier(.1,.6,.2,1)}.prog.done i{width:100%;opacity:0;transition:width .25s,opacity .5s .25s}
.bmb{display:flex;gap:2px;padding:4px 8px;overflow:hidden;flex:none;border-bottom:1px solid var(--line)}.bmb.off{display:none}
.bm{display:flex;align-items:center;gap:7px;height:26px;padding:0 10px;border-radius:8px;font-size:.74rem;color:#c3d3e0;white-space:nowrap;max-width:150px;overflow:hidden}.bm:hover{background:var(--soft)}
.pages{flex:1;position:relative;min-height:0}.pg{position:absolute;inset:0;display:none;flex-direction:column}.pg.on{display:flex}.pg iframe{flex:1;width:100%;border:0;background:#0a1219}
.ntp{flex:1;display:flex;flex-direction:column;align-items:center;padding:9vh 20px 0;overflow:auto}.ntp h1{font-weight:200;font-size:2.6rem;letter-spacing:.35em;margin-bottom:26px;color:var(--acc);padding-left:.35em}
.ntp .fld{max-width:540px;height:48px;border-radius:999px;text-align:center}.ntp .tg{display:grid;grid-template-columns:repeat(auto-fill,96px);gap:6px;justify-content:center;margin-top:34px;width:min(660px,100%)}
.hist{padding:22px;overflow:auto;max-width:740px;margin:0 auto;width:100%}.hi{display:flex;gap:12px;align-items:center;padding:9px 10px;border-radius:9px;font-size:.82rem;cursor:pointer}.hi:hover{background:var(--soft)}.hi small{color:var(--mut);margin-left:auto;white-space:nowrap}.hi span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sug{position:absolute;left:0;right:0;top:40px;z-index:20;border-radius:14px;padding:6px;display:none;background:var(--solid)}.sug.on{display:block}
.sg{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;font-size:.8rem;cursor:pointer}.sg svg{width:16px;height:16px;color:var(--mut)}.sg:hover,.sg.hl{background:var(--soft)}.sg small{color:var(--mut);margin-left:auto}.sg span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dd{position:absolute;right:8px;top:88px;z-index:30;min-width:230px;border-radius:14px;padding:6px;display:none;background:var(--solid)}.dd.on{display:block;animation:pop2 .2s var(--ease)}@keyframes pop2{from{opacity:0;transform:translateY(-6px)}}
.dd button{display:flex;width:100%;align-items:center;gap:12px;padding:9px 12px;border-radius:9px;font-size:.82rem;text-align:left}.dd button:hover{background:var(--soft)}.dd svg{width:16px;height:16px;color:var(--mut)}
.zr{display:flex;align-items:center;gap:8px;padding:6px 12px;font-size:.82rem}.zr span{flex:1}.zr button{width:28px!important;height:28px;padding:0!important;justify-content:center}.zr b{width:44px;text-align:center;font-weight:500}
.ab{flex:1;position:relative;display:flex}.ab .fld{padding-left:16px}.ab.has .fld{padding-left:38px}
.wp{position:relative}.wp i{position:absolute;top:6px;right:6px;font-style:normal;font-size:.55rem;letter-spacing:.12em;text-transform:uppercase;background:rgba(0,0,0,.55);padding:2px 7px;border-radius:99px}
#wall{overflow:hidden}.blob{position:absolute;width:62vmax;height:62vmax;border-radius:50%;filter:blur(90px);opacity:.5;animation:drift 24s ease-in-out infinite alternate}
@keyframes drift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(12vw,8vh) scale(1.2)}100%{transform:translate(-8vw,14vh) scale(.9)}}
.gs{display:flex;gap:8px}.gs .fld{flex:1}.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.chip{padding:6px 12px;border-radius:99px;background:var(--soft);font-size:.74rem;transition:.2s}.chip:hover{background:rgba(255,255,255,.15)}
.chk{display:flex;gap:8px;align-items:center;font-size:.8rem;color:var(--mut);cursor:pointer}.gm{color:var(--mut);font-size:.78rem}
.gres{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}.gres img{width:100%;height:78px;object-fit:cover;border-radius:10px;cursor:pointer;transition:transform .2s var(--ease)}.gres img:hover{transform:scale(1.04)}
details summary{cursor:pointer;color:var(--mut);font-size:.8rem}details .fld{margin-top:8px}details small{display:block;margin-top:8px;color:var(--mut);line-height:1.5}
@media(max-width:700px){#tray b{display:none}#shelf .sep,#shelf .x2{display:none}}

/* ── v2: smooth + browser + studio ── */
html{scroll-behavior:smooth}*{scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.18) transparent}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16);border-radius:9px}
button,.fld,.btn,.chip,.q,.wp,.tb,.bm,.hi,.sg,.ic,.sb{transition-duration:.25s;transition-timing-function:var(--ease)}
.tile,.sb .tile{box-shadow:inset 0 1px 0 rgba(255,255,255,.25)!important}.ic span{text-shadow:none}
#shelf,#tray{box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.win{will-change:transform,opacity}.win.max{animation:wmax .3s var(--ease)}@keyframes wmax{from{opacity:.6;transform:scale(.98)}}
select.fld option{background:#0b121c}
.tabs{padding:8px 10px 0;gap:6px;background:linear-gradient(rgba(0,0,0,.36),rgba(0,0,0,.18))}
.tb{height:36px;border-radius:12px 12px 0 0;animation:tabin .35s var(--ease) both}@keyframes tabin{from{opacity:0;transform:translateY(8px) scale(.94)}}
.tb.on{background:linear-gradient(rgba(140,200,240,.14),var(--solid) 90%);box-shadow:inset 0 2px 0 var(--acc)}
.nav{padding:10px;gap:6px;background:var(--solid);align-items:center}
.nav .fld{height:38px;border-radius:999px;background:rgba(255,255,255,.06);padding:0 92px 0 18px}.nav .fld:focus{background:rgba(0,0,0,.4)}
.ab.has .fld{padding-left:40px}.afv{top:11px;left:14px}
.ab.has::after{content:"PROXIED";position:absolute;right:16px;top:50%;transform:translateY(-50%);font-size:.58rem;letter-spacing:.14em;color:#6ee7b7;background:rgba(110,231,183,.1);padding:3px 8px;border-radius:99px;pointer-events:none}
.nav .wb:hover{transform:translateY(-1px)}
.prog{height:3px}.prog i{background:linear-gradient(90deg,transparent,var(--acc),#a5f3fc);box-shadow:0 0 12px var(--acc)}
.pg.on iframe{animation:fadein .5s var(--ease)}@keyframes fadein{from{opacity:0}}
.bmb{padding:5px 10px;background:rgba(0,0,0,.14)}.bm{border-radius:99px;height:28px}.bm:hover{transform:translateY(-1px)}
.sug{top:46px;border-radius:18px}.sug.on{animation:pop2 .25s var(--ease)}.sg{border-radius:12px}.dd{top:104px;right:10px;border-radius:18px}
.ntp h1{background:linear-gradient(90deg,#8cc8f0,#a78bfa);-webkit-background-clip:text;background-clip:text;color:transparent;animation:fadein .8s var(--ease)}
.ntp .fld{background:rgba(255,255,255,.07)}.ntp .fld:focus{transform:scale(1.02)}
.cs{flex-direction:row!important;background:#0b1118;font:13px/1.55 ui-monospace,'JetBrains Mono',Menlo,Consolas,monospace}

    if(!tabs.length)return w.el.querySelector('[data-a=x]').click();if(cur===t)switchTab(tabs[Math.min(n,tabs.length-1)])}
  function back(){const t=cur;if(!t||!t.url)return;
    if(t.frame){try{t.frame.contentWindow.history.back();return}catch{}}
    if(t.i>0){t.i--;nav(t,t.h[t.i],false)}else ntp(t)}
  function fwd(){const t=cur;if(!t)return;if(t.frame&&t.url){try{t.frame.contentWindow.history.forward();return}catch{}}
    if(t.i<t.h.length-1){t.i++;nav(t,t.h[t.i],false)}}
  function reloadTab(){const t=cur;if(!t||!t.url)return;
    if(t.loading){try{t.frame.contentWindow.stop()}catch{}return setLoading(t,false)}
    setLoading(t,true);t.frame.src=t.frame.getAttribute('src')}

  /* address bar + suggestions */
  function showSug(){const q=input.value.trim(),ql=q.toLowerCase();if(!q||q===cur?.url){sug.classList.remove('on');return}
    const seen=new Set(),m=[...items.map(i=>({url:i.url,title:i.name})),...hist].filter(x=>(x.title+x.url).toLowerCase().includes(ql)&&!seen.has(x.url)&&seen.add(x.url)).slice(0,5);
    const rows=[{v:q,t:isUrl(q)?`Go to ${q}`:`Search “${q}”`,s:''},...m.map(x=>({v:x.url,t:x.title,s:hostOf(x.url)}))];hl=-1;
    sug.innerHTML=rows.map((r,n)=>`<div class="sg" data-v="${esc(r.v)}">${ic(n?'globe':'search')}<span>${esc(r.t)}</span><small>${esc(r.s)}</small></div>`).join('');
    sug.querySelectorAll('.sg').forEach(d=>d.onmousedown=e=>{e.preventDefault();sug.classList.remove('on');nav(cur,d.dataset.v);input.blur()});sug.classList.add('on')}
  input.oninput=showSug;input.onfocus=()=>input.select();input.onblur=()=>{sug.classList.remove('on');syncBar()};
  input.onkeydown=e=>{const rows=[...sug.querySelectorAll('.sg')];
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();hl=(hl+(e.key==='ArrowDown'?1:-1)+rows.length)%rows.length;rows.forEach((r,n)=>r.classList.toggle('hl',n===hl));if(rows[hl])input.value=rows[hl].dataset.v}
    else if(e.key==='Enter'){sug.classList.remove('on');nav(cur,input.value);input.blur()}else if(e.key==='Escape'){input.value=cur.url;sug.classList.remove('on');input.blur()}};

  /* toolbar */
  Q('[data-n=nt]').onclick=()=>newTab();bk.onclick=back;fw.onclick=fwd;reload.onclick=reloadTab;Q('[data-n=home]').onclick=()=>ntp(cur);
  star.onclick=()=>{if(!cur.url)return notify('Open a page first');const it=items.find(i=>same(i.url,cur.url));
    if(it){items=items.filter(x=>x!==it);saveItems();renderGrid();notify('Bookmark removed',cur.title)}else{items.push({id:'l'+Date.now(),name:cur.title,url:cur.url});saveItems();renderGrid();notify('Bookmarked',cur.title+' · added to home')}};

  /* bookmarks bar (mirrors home shortcuts) */
  function bar(){bmb.innerHTML='';bmb.classList.toggle('off',!showBar||!items.length);
    items.forEach(it=>{const b=document.createElement('button');b.className='bm';b.title=it.url;b.innerHTML=`<img class="fv" alt="" data-fav="${esc(it.url)}"><span>${esc(it.name)}</span>`;
      b.onclick=e=>e.ctrlKey||e.metaKey?newTab(it.url,true):nav(cur,it.url);b.onauxclick=e=>{if(e.button===1)newTab(it.url,true)};
      b.oncontextmenu=e=>{e.preventDefault();e.stopPropagation();ctx(e,[['Open in new tab',()=>newTab(it.url)],...linkMenu(it).slice(1)])};bmb.appendChild(b)});if(cur)syncBar()}

  /* menu */
  const ddRow=(l,i,fn)=>{const b=document.createElement('button');b.innerHTML=ic(i)+'<span>'+l+'</span>';b.onclick=e=>{e.stopPropagation();fn()};dd.appendChild(b)};
  function ddRender(){dd.innerHTML='';const z=Math.round(cur.z*100);
    ddRow('New tab','plus',()=>{dd.classList.remove('on');newTab()});ddRow('New window','max',()=>{dd.classList.remove('on');browserApp()});
    ddRow('History','clock',()=>{dd.classList.remove('on');const t=cur.url||cur.title!=='New Tab'?newTab():cur;showHist(t)});
    ddRow(showBar?'Hide bookmarks bar':'Show bookmarks bar','star',()=>{showBar=!showBar;store.set('bmbar',showBar);bar();ddRender()});
    const zr=document.createElement('div');zr.className='zr';zr.innerHTML=`<span>Zoom</span><button data-z="-1">−</button><b>${z}%</b><button data-z="1">+</button>`;
    zr.onclick=e=>{e.stopPropagation();const d=+e.target.dataset.z;if(!d)return;cur.z=Math.min(2,Math.max(.5,Math.round((cur.z+d*.1)*10)/10));if(cur.frame)cur.frame.style.zoom=cur.z;ddRender()};dd.appendChild(zr);
    ddRow('Full screen','max',()=>{dd.classList.remove('on');document.fullscreenElement?document.exitFullscreen():w.el.requestFullscreen?.()});
    ddRow('Set wallpaper from clipboard','sun',()=>{dd.classList.remove('on');clipWall()});
    ddRow('Clear browsing data','x',()=>{hist=[];store.set('hist',hist);dd.classList.remove('on');notify('Browsing data cleared')})}
  Q('[data-n=menu]').onclick=e=>{e.stopPropagation();dd.classList.toggle('on');if(dd.classList.contains('on'))ddRender()};
  w.el.addEventListener('pointerdown',e=>{if(!e.target.closest('.dd')&&!e.target.closest('[data-n=menu]'))dd.classList.remove('on')});

  w.api={bar,
    open(u){if(!u)return newTab();const ex=tabs.find(x=>x.url&&same(x.url,u));if(ex)return switchTab(ex);if(cur&&!cur.url&&!cur.loading&&cur.title==='New Tab')return nav(cur,u);newTab(u)},
    key(e){const c=e.ctrlKey||e.metaKey;
      if(e.altKey&&e.key==='ArrowLeft'){e.preventDefault();back()}else if(e.altKey&&e.key==='ArrowRight'){e.preventDefault();fwd()}
      else if(c&&e.key==='l'){e.preventDefault();input.focus()}else if(e.key==='F5'||(c&&e.key==='r')){e.preventDefault();reloadTab()}
      else if(c&&e.key==='t'){e.preventDefault();newTab()}else if(c&&e.key==='w'){e.preventDefault();closeTab(cur)}else if(c&&e.key==='d'){e.preventDefault();star.click()}
      else if(c&&e.key==='Tab'){e.preventDefault();switchTab(tabs[(tabs.indexOf(cur)+(e.shiftKey?-1:1)+tabs.length)%tabs.length])}}};
  bar();newTab(target||'');
}
function renderSettings(){const w=wins.find(x=>x.app==='settings');if(!w)return;const cur=store.get('wall',{type:'fog'}),g=store.get('gkey',{});

  ${cur.type==='image'?`<div class="wp on" style="background-image:url('${esc(asset(cur.src))}')">Custom</div>`:cur.type==='video'||cur.type==='file'?'<div class="wp on" style="background:#111">Custom '+(cur.kind||'video')+'</div>':''}</div>
  <h4>Find images &amp; GIFs</h4>
  <div class="gs"><input class="fld" id="gq" placeholder="Search images or GIFs…" value="${esc(gq)}"/><button class="btn p" id="gb">Search</button></div>
  <div class="chips"><label class="chk"><input type="checkbox" id="gg" ${ggif?'checked':''}> Animated GIFs only</label>${['Space','City at night','Mountains','Anime','Ocean','Cyberpunk'].map(c=>`<button class="chip">${c}</button>`).join('')}<button class="chip" id="gopen">Open in Browser ↗</button></div>
  <div class="gm">${esc(gmsg)}</div><div class="gres">${gres.map((r,n)=>`<img data-n="${n}" referrerpolicy="no-referrer" src="${esc(asset(r.image.thumbnailLink))}" title="${esc(r.title||'')}">`).join('')}</div>
  <details ${g.key&&g.cx?'':'open'}><summary>Optional: Google API for real Google results (free: 100/day)</summary>
    <input class="fld" id="gk" placeholder="API key" value="${esc(g.key||'')}" spellcheck="false"/><input class="fld" id="gc" placeholder="Search engine ID (cx) — with image search on" value="${esc(g.cx||'')}" spellcheck="false"/>
    <small>Create a key in Google Cloud (Custom Search API) and a Programmable Search Engine at programmablesearchengine.google.com. Searches are sent through your proxy.</small></details>
  <h4>Your own</h4><div class="gm">Drop an image, GIF or video on the desktop, or paste it with Ctrl+V.</div><div class="row" style="justify-content:flex-start"><button class="btn" id="up">Upload image or GIF…</button><input type="file" id="fi" accept="image/*,video/mp4,video/webm" hidden/></div>
  <input class="fld" id="wu" placeholder="Paste an image, GIF or .mp4/.webm URL and press Enter" spellcheck="false"/>
  <h4>Proxy</h4><div class="chips">${['scramjet','classic'].map(k=>`<button class="chip" data-e="${k}" style="${SJCFG.engine===k?'background:var(--ink);color:#07111a':''}">${k==='scramjet'?'Scramjet':'Classic'}</button>`).join('')}<span class="gm">${SJ?'Scramjet is running':'Using the classic proxy'}</span></div>
  <details ${SJ?'':'open'}><summary>Scramjet setup</summary>${[['dir','Files folder (/scram/)'],['prefix','URL prefix (/scramjet/)'],['sw','Service worker (/sw.js)'],['bm','BareMux folder (/baremux/)'],['tp','Transport (/epoxy/index.mjs)'],['wisp','Wisp server (wss://…/wisp/)']].map(([k,l])=>`<input class="fld" data-k="${k}" placeholder="${l}" spellcheck="false" value="${esc(SJCFG[k])}"/>`).join('')}<small>These files must be served from the same site as this page.</small></details>
  <details><summary>Classic proxy address</summary><input class="fld" id="pxu" placeholder="Proxy address" spellcheck="false" value="${esc(PROXY_BASE)}"/></details>
  <div class="row" style="justify-content:flex-start"><button class="btn" id="pxa">Apply &amp; reload</button><button class="btn" id="pxt">Test</button></div><div class="gm" id="pxm">Pages, icons and wallpapers all load through the proxy.</div>
  <h4>Profile &amp; privacy</h4><input class="fld" id="nm" placeholder="Your name" maxlength="20" value="${esc(S.name)}"/>
  <div class="gm">🔒 Strict proxy mode: sites, logos, wallpapers, scripts and searches all load through your proxy.</div>
  <h4>Home</h4><div class="row" style="justify-content:flex-start"><button class="btn" id="sa">Add shortcut</button><button class="btn" id="rs">Reset OS</button></div>`;
  const Q=s=>w.body.querySelector(s);
  w.body.querySelectorAll('[data-t]').forEach(e=>e.onclick=()=>{const t=e.dataset.t;setWall(t==='fog'?{type:'fog'}:{type:t,id:e.dataset.id})});
  Q('#gq').oninput=e=>gq=e.target.value;Q('#gq').onkeydown=e=>{if(e.key==='Enter')gSearch()};Q('#gb').onclick=gSearch;Q('#gg').onchange=e=>{ggif=e.target.checked;if(gq.trim())gSearch()};
  w.body.querySelectorAll('.chip:not(#gopen)').forEach(c=>c.onclick=()=>{gq=c.textContent;gSearch()});
  Q('#gopen').onclick=()=>openUrl('https://www.google.com/search?tbm=isch&q='+encodeURIComponent(gq||'wallpaper'));
  w.body.querySelectorAll('.gres img').forEach(im=>im.onclick=()=>{const r=gres[+im.dataset.n];setUrlWall(r.link,r.image.thumbnailLink)});
  const sk=()=>store.set('gkey',{key:Q('#gk').value.trim(),cx:Q('#gc').value.trim()});Q('#gk').onchange=sk;Q('#gc').onchange=sk;
  Q('#up').onclick=()=>Q('#fi').click();Q('#fi').onchange=e=>e.target.files[0]&&fileToWall(e.target.files[0]);
  Q('#wu').onkeydown=e=>{const v=e.target.value.trim();if(e.key==='Enter'&&v)setUrlWall(v)};
  Q('#nm').oninput=e=>{S.name=e.target.value;saveS()};
  Q('#pxu').onchange=e=>{let v=e.target.value.trim();if(v&&!v.endsWith('/'))v+='/';PROXY_BASE=v||DEFAULT_PROXY;store.set('proxy',PROXY_BASE);notify('Proxy updated')};
  Q('#pxt').onclick=async()=>{const m=Q('#pxm'),t0=performance.now();m.textContent='Testing…';try{await fetch(proxify('https://example.com/'),{mode:'no-cors'});m.textContent='Proxy reachable · '+Math.round(performance.now()-t0)+' ms'}catch{m.textContent='Could not reach the proxy. Check the address.'}};
  w.body.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{SJCFG.engine=b.dataset.e;store.set('sjcfg',SJCFG);location.reload()});
  Q('#pxa').onclick=()=>{w.body.querySelectorAll('[data-k]').forEach(i=>SJCFG[i.dataset.k]=i.value.trim());store.set('sjcfg',SJCFG);location.reload()};
  Q('#sa').onclick=()=>shortcutDialog();
  Q('#rs').onclick=()=>{if(confirm('Erase all Lunar OS data and start over?')){Object.keys(localStorage).filter(k=>k.startsWith('lunar:')).forEach(k=>localStorage.removeItem(k));location.reload()}}}

/* ── launcher ── */
function renderLaunch(q=''){const g=$('#lg');g.innerHTML='';g.classList.toggle('typing',!!q);q=q.toLowerCase();
  const all=[...Object.keys(SYS).map(a=>({app:a,name:SYS[a].name})),...items].filter(i=>i.name.toLowerCase().includes(q));
  all.forEach((it,n)=>{const d=document.createElement('div');d.className='ic';d.style.setProperty('--n',n);d.innerHTML=tileHTML(it);d.onclick=()=>launch(it);g.appendChild(d)})}
function toggleLaunch(){const o=$('#launch').classList.toggle('open');$('#panel').classList.remove('open');$('#tray').classList.remove('on');if(o){$('#lq').value='';renderLaunch();setTimeout(()=>$('#lq').focus(),120)}}
$('#lq').oninput=e=>renderLaunch(e.target.value);
$('#lq').onkeydown=e=>{if(e.key==='Enter'&&e.target.value.trim()){const first=$('#lg .ic');if(first&&!isUrl(e.target.value))first.click();else openUrl(e.target.value)}};
$('#launch').onclick=e=>{if(e.target.id==='launch'||e.target.id==='lg')closeOverlays()};
function closeOverlays(){$('#launch').classList.remove('open');$('#panel').classList.remove('open');$('#tray').classList.remove('on')}

/* ── quick settings + notifications ── */
function renderPanel(){const p=$('#panel'),wifi=S.wifi&&!S.plane;
  const q=(k,icn,l,sub,on)=>`<button class="q ${on?'on':''}" data-q="${k}">${ic(icn)}<span>${l}<small>${sub}</small></span></button>`;
  p.innerHTML=`<div class="qs">${q('wifi',wifi?'wifi':'wifiOff','Wi-Fi',wifi?'Connected':'Off',wifi)}${q('dnd',S.dnd?'bellOff':'bell','Do Not Disturb',S.dnd?'On':'Off',S.dnd)}
  ${q('plane','plane','Airplane',S.plane?'On':'Off',S.plane)}${q('night','moon','Night light',S.night?'On':'Off',S.night)}</div>
  <div class="sl">${ic('sun')}<input type="range" id="rB" min="25" max="100" value="${S.bright}"/><b>${S.bright}%</b></div>
  <div class="sl">${ic('vol')}<input type="range" id="rV" min="0" max="100" value="${S.vol}"/><b>${S.vol}%</b></div>
  <div class="nh"><span>Notifications</span><button id="nclr">Clear all</button></div>
  <div class="nl">${notes.length?notes.map(n=>`<div class="nc"><b>${esc(n.title)}</b>${n.body?`<small>${esc(n.body)}</small>`:''}</div>`).join(''):'<div class="none">You\'re all caught up</div>'}</div>`;
  p.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{const k=b.dataset.q;
    if(k==='plane'){S.plane=!S.plane}else if(k==='wifi'){S.wifi=!S.wifi;if(S.wifi)S.plane=false}else S[k]=!S[k];saveS();applySys();renderPanel()});
  p.querySelector('#rB').oninput=e=>{S.bright=+e.target.value;e.target.nextElementSibling.textContent=S.bright+'%';applySys()};p.querySelector('#rB').onchange=saveS;
  p.querySelector('#rV').oninput=e=>{S.vol=+e.target.value;e.target.nextElementSibling.textContent=S.vol+'%'};p.querySelector('#rV').onchange=saveS;
  p.querySelector('#nclr').onclick=()=>{notes=[];store.set('notes',notes);renderPanel()}}
$('#tray').onclick=e=>{e.stopPropagation();$('#launch').classList.remove('open');const o=$('#panel').classList.toggle('open');$('#tray').classList.toggle('on',o);if(o)renderPanel()};
$('#panel').onclick=e=>e.stopPropagation();
document.addEventListener('click',()=>{$('#ctx').style.display='none';$('#panel').classList.remove('open');$('#tray').classList.remove('on')});
document.addEventListener('keydown',e=>{wins.find(x=>x.api&&x.el.classList.contains('focus')&&!x.el.classList.contains('min'))?.api.key(e)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeOverlays();closeDlg()}});

/* ── lock screen + first-run setup ── */
const lock=$('#lock');let picked=null;
function enter(){lock.classList.add('gone');document.body.classList.add('on');renderGrid();const n=S.name;if(n)setTimeout(()=>notify(`Welcome back, ${n}`),700)}
function showSetup(){lock.classList.add('blur');
  $('#setup').innerHTML=`<h2>Welcome to Lunar OS</h2><p>Let's make it yours.</p><input class="fld" id="sn" placeholder="What should we call you?" maxlength="20"/>
  <div class="mini"><div data-p="fog" class="on" style="background:linear-gradient(135deg,#3f7ea6,#030a12)"></div>${PRESETS.slice(0,3).map(p=>`<div data-p="${p.id}" style="background:${p.css}"></div>`).join('')}</div>
  <button class="btn p" id="gs">Get started</button>`;picked='fog';
  $('#setup').querySelectorAll('[data-p]').forEach(d=>d.onclick=()=>{$('#setup').querySelectorAll('[data-p]').forEach(x=>x.classList.remove('on'));d.classList.add('on');picked=d.dataset.p;
    store.set('wall',picked==='fog'?{type:'fog'}:{type:'preset',id:picked});applyWall()});
  $('#gs').onclick=e=>{e.stopPropagation();S.name=$('#sn').value.trim();saveS();store.set('setup',true);enter();if(S.name)setTimeout(()=>notify(`Welcome, ${S.name}`,'Right-click the desktop to add shortcuts'),700)};
  setTimeout(()=>$('#sn').focus(),400)}
lock.onclick=e=>{if(e.target.closest('#setup')||lock.classList.contains('gone'))return;store.get('setup',false)?enter():(lock.classList.contains('blur')||showSetup())};
$('#skip').onclick=e=>{e.stopPropagation();store.set('setup',true);enter()};
$('#setup').onclick=e=>e.stopPropagation();

window.addEventListener('message',e=>{const d=e.data;   // proxied pages can hand links back to the OS
  if(!d||d.cs||!e.origin||!PROXY_BASE.startsWith(e.origin))return;
  if((d.type==='lunar-open'||d.type==='lunar-nav')&&typeof d.url==='string')openUrl(unproxify(d.url))});
/* proxy everything: links, window.open and dropped URLs all route into the proxied browser */
document.addEventListener('click',e=>{const a=e.target.closest?.('a[href]');if(a&&/^https?:/i.test(a.href)&&!a.href.startsWith(location.origin)){e.preventDefault();openUrl(a.href)}},true);
window.open=u=>{if(u)openUrl(String(u));return null};
document.addEventListener('dragover',e=>e.preventDefault());
document.addEventListener('drop',e=>{e.preventDefault();const dt=e.dataTransfer,f=dt.files[0],IMG=/\.(png|jpe?g|gif|webp|avif|mp4|webm)(\?|#|$)/i;
  if(f&&/^(image|video)\//.test(f.type))return fileToWall(f);
  const u=(dt.getData('text/uri-list')||'').split('\n')[0],im=/<img[^>]+src=["']([^"']+)/i.exec(dt.getData('text/html')||'');
  if(u&&IMG.test(u))return setUrlWall(u);if(im&&!/^data:/.test(im[1]))return setUrlWall(im[1]);if(u)openUrl(u)});
document.addEventListener('paste',e=>{if(e.target.closest?.('input,textarea'))return;const f=[...e.clipboardData.files].find(x=>/^(image|video)\//.test(x.type));if(f)return fileToWall(f);
  const t=e.clipboardData.getData('text').trim();if(/^https?:\/\/\S+$/.test(t)&&/\.(png|jpe?g|gif|webp|avif|mp4|webm)(\?|#|$)/i.test(t))setUrlWall(t)});
const shelf=$('#shelf');
shelf.addEventListener('pointermove',e=>{if(e.pointerType!=='mouse')return;shelf.querySelectorAll('.sb').forEach(b=>{const r=b.getBoundingClientRect(),k=Math.max(0,1-Math.abs(e.clientX-r.left-r.width/2)/110);
  b.style.transition='transform .12s linear';b.style.transform=`translateY(${-10*k}px) scale(${1+.45*k})`})});
shelf.addEventListener('pointerleave',()=>shelf.querySelectorAll('.sb').forEach(b=>{b.style.transition='';b.style.transform=''}));
ready.then(renderGrid);renderShelf();renderPanel();
})();
