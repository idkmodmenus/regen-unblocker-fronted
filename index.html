<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Regen Unblocker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      background-color: #030304;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      position: relative;
    }

    #bg-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    .glow-orb {
      position: fixed;
      width: 650px;
      height: 650px;
      background: radial-gradient(circle, rgba(162, 98, 247, 0.14) 0%, rgba(0, 0, 0, 0) 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      z-index: 1;
      pointer-events: none;
      animation: pulseGlow 8s ease-in-out infinite alternate;
    }

    @keyframes pulseGlow {
      0% { transform: translate(-50%, -50%) scale(0.8); opacity: 0.6; }
      100% { transform: translate(-50%, -50%) scale(1.3); opacity: 1; }
    }

    /* Centered Main Layout */
    main {
      position: relative;
      z-index: 2;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 3rem 1.5rem;
      text-align: center;
      min-height: 100vh;
    }

    .hero-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 680px;
      animation: fadeIn 0.5s ease-out;
    }

    h1 {
      font-size: 3.5rem;
      font-weight: 700;
      letter-spacing: -0.04em;
      color: #ffffff;
      margin-bottom: 0.5rem;
      text-shadow: 0 0 35px rgba(187, 134, 252, 0.3);
    }

    .accent-text {
      color: #bb86fc;
      background: linear-gradient(135deg, #d3a4ff 0%, #a262f7 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p {
      color: #71717a;
      font-size: 0.95rem;
      letter-spacing: -0.01em;
      font-weight: 400;
      margin-bottom: 2rem;
    }

    .search-box {
      width: 100%;
      max-width: 520px;
      position: relative;
      margin-bottom: 2rem;
    }

    .search-bar {
      width: 100%;
      padding: 0.95rem 1.4rem 0.95rem 3rem;
      border-radius: 9999px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(12, 12, 16, 0.65);
      backdrop-filter: blur(18px);
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
    }

    .search-icon {
      position: absolute;
      left: 1.1rem;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      stroke: rgba(255, 255, 255, 0.35);
      pointer-events: none;
    }

    .search-bar::placeholder {
      color: rgba(255, 255, 255, 0.35);
    }

    .search-bar:focus {
      border-color: rgba(186, 133, 255, 0.55);
      background: rgba(16, 16, 22, 0.9);
      box-shadow: 0 0 35px rgba(186, 133, 255, 0.25);
      transform: scale(1.01);
    }

    /* Quick Links */
    .quick-links {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 0.75rem;
      width: 100%;
      max-width: 520px;
    }

    @media (max-width: 520px) {
      .quick-links {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    .quick-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      padding: 0.75rem 0.5rem;
      border-radius: 12px;
      color: #d1d5db;
      text-decoration: none;
      font-size: 0.75rem;
      font-weight: 500;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .quick-btn svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    .quick-btn:hover {
      background: rgba(187, 134, 252, 0.12);
      border-color: rgba(187, 134, 252, 0.35);
      color: #fff;
      transform: translateY(-2px);
    }

    /* ========================================================
       TOP BROWSER BAR (EXPANDED & REFINED)
    ======================================================== */
    .top-browser-bar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 150;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .top-browser-bar.hidden {
      transform: translateY(-52px);
    }

    .browser-toolbar {
      width: 100%;
      height: 52px;
      background: rgba(13, 13, 18, 0.95);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      padding: 0 0.85rem;
      gap: 0.5rem;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.6);
    }

    .nav-controls, .window-actions {
      display: flex;
      align-items: center;
      gap: 0.2rem;
    }

    .nav-btn {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      border: none;
      background: transparent;
      color: #94a3b8;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      transition: all 0.15s ease;
    }

    .nav-btn svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      stroke-width: 2.1;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .nav-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
    }

    .nav-divider {
      width: 1px;
      height: 18px;
      background: rgba(255, 255, 255, 0.08);
      margin: 0 0.25rem;
    }

    /* Address Pill with Security Badge & Clear Icon */
    .address-pill {
      flex: 1;
      max-width: 820px;
      height: 36px;
      background: #161620;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      display: flex;
      align-items: center;
      padding: 0 0.6rem 0 0.8rem;
      gap: 0.5rem;
      transition: all 0.2s ease;
    }

    .address-pill:focus-within {
      background: #1b1b26;
      border-color: rgba(186, 133, 255, 0.55);
      box-shadow: 0 0 16px rgba(186, 133, 255, 0.2);
    }

    .security-badge {
      display: flex;
      align-items: center;
      gap: 0.3rem;
      color: #10b981;
      font-size: 0.7rem;
      font-weight: 600;
      user-select: none;
      padding: 2px 6px;
      border-radius: 6px;
      background: rgba(16, 185, 129, 0.1);
    }

    .security-badge svg {
      width: 12px;
      height: 12px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2.2;
    }

    .address-input-field {
      flex: 1;
      border: none;
      background: transparent;
      color: #f1f5f9;
      font-size: 0.88rem;
      outline: none;
      letter-spacing: -0.01em;
    }

    .pill-action-btn {
      width: 22px;
      height: 22px;
      border: none;
      background: transparent;
      color: #71717a;
      border-radius: 50%;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .pill-action-btn:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.1);
    }

    .pill-action-btn svg {
      width: 12px;
      height: 12px;
      stroke: currentColor;
      stroke-width: 2.2;
    }

    .nav-btn.close-btn:hover {
      background: rgba(239, 68, 68, 0.2);
      color: #ef4444;
    }

    /* Chevron Toggle Handle */
    .collapse-handle {
      width: 44px;
      height: 18px;
      background: rgba(13, 13, 18, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-top: none;
      border-radius: 0 0 10px 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #71717a;
      transition: all 0.2s ease;
      box-shadow: 0 8px 16px rgba(0,0,0,0.4);
    }

    .collapse-handle:hover {
      color: #fff;
      background: #17171f;
    }

    .collapse-handle svg {
      width: 13px;
      height: 13px;
      stroke: currentColor;
      stroke-width: 2.2;
      fill: none;
      transition: transform 0.25s ease;
    }

    .top-browser-bar.hidden .collapse-handle svg {
      transform: rotate(180deg);
    }

    /* ========================================================
       FUTURISTIC LOADING SCREEN OVERLAY
    ======================================================== */
    .loading-overlay {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, rgba(16, 12, 24, 0.92) 0%, rgba(3, 3, 4, 0.98) 100%);
      backdrop-filter: blur(14px);
      z-index: 140;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.25rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .loading-overlay.active {
      opacity: 1;
      pointer-events: all;
    }

    .cyber-spinner {
      position: relative;
      width: 54px;
      height: 54px;
    }

    .cyber-spinner::before, .cyber-spinner::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 2px solid transparent;
      border-top-color: #bb86fc;
      animation: spin 1s cubic-bezier(0.68, -0.55, 0.27, 1.55) infinite;
    }

    .cyber-spinner::after {
      border: 2px solid rgba(187, 134, 252, 0.15);
      border-top-color: transparent;
      animation: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-text-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.35rem;
    }

    .loading-brand {
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #bb86fc;
      text-shadow: 0 0 12px rgba(187, 134, 252, 0.4);
    }

    .loading-status {
      font-size: 0.78rem;
      color: #71717a;
      letter-spacing: -0.01em;
    }

    /* Modal / Web Viewport */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 100;
      align-items: center;
      justify-content: center;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      width: 100%;
      height: 100%;
      background: #000;
      border: none;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .loader-bar {
      position: absolute;
      top: 0;
      left: 0;
      height: 2.5px;
      width: 0%;
      background: linear-gradient(90deg, #bb86fc, #e879f9, #a855f7);
      box-shadow: 0 0 10px rgba(187, 134, 252, 0.8);
      z-index: 160;
      transition: width 0.3s ease, opacity 0.3s ease;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #fff;
    }

    /* Toast Notification */
    .toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(30px);
      background: rgba(22, 22, 30, 0.9);
      border: 1px solid rgba(187, 134, 252, 0.3);
      color: #fff;
      padding: 0.6rem 1.2rem;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 200;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

    <!-- Chevron Toggle Handle -->

      </svg>

  </div>

          <svg viewBox="0 0 24 24"><path d="M12 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0zm5.01 4.744c.688 0 1.25.56 1.25 1.249a1.25 1.25 0 0 1-2.498.056l-2.597-.547-.8 3.747c1.824.07 3.48.632 4.674 1.488.308-.309.73-.491 1.207-.491.968 0 1.754.786 1.754 1.754 0 .716-.435 1.333-1.01 1.614a3.111 3.111 0 0 1 .042.52c0 2.694-3.13 4.87-7.004 4.87-3.874 0-7.004-2.176-7.004-4.87 0-.183.015-.366.043-.534A1.748 1.748 0 0 1 4.028 12c0-.968.786-1.754 1.754-1.754.463 0 .898.196 1.207.49 1.207-.883 2.878-1.43 4.744-1.487l.885-4.182a.342.342 0 0 1 .14-.197.35.35 0 0 1 .238-.042l2.906.617a1.214 1.214 0 0 1 1.108-.701zM9.25 12C8.56 12 8 12.56 8 13.25c0 .688.56 1.25 1.25 1.25.687 0 1.248-.562 1.248-1.25 0-.69-.56-1.25-1.248-1.25zm5.5 0c-.687 0-1.248.56-1.248 1.25 0 .688.561 1.25 1.248 1.25.688 0 1.25-.562 1.25-1.25 0-.69-.562-1.25-1.25-1.25zm-5.466 3.99a.327.327 0 0 0-.231.094.33.33 0 0 0 0 .463c.842.842 2.484.913 2.961.913.477 0 2.105-.056 2.961-.913a.361.361 0 0 0 .029-.463.33.33 0 0 0-.464 0c-.547.533-1.684.73-2.512.73-.828 0-1.979-.197-2.512-.73a.326.326 0 0 0-.232-.095z"/></svg>
          Reddit

        <a class="quick-btn" onclick="openSearch('https://google.com')">
          <svg viewBox="0 0 24 24"><path d="M12.48 10.92v3.28h7.84c-.24 1.84-.853 3.187-1.787 4.133-1.147 1.147-2.933 2.4-6.053 2.4-4.827 0-8.6-3.893-8.6-8.72s3.773-8.72 8.6-8.72c2.6 0 4.507 1.027 5.907 2.347l2.307-2.307C18.747 1.44 16.133 0 12.48 0 5.867 0 .307 5.387.307 12s5.56 12 12.173 12c3.573 0 6.267-1.173 8.373-3.36 2.16-2.16 2.84-5.213 2.84-7.667 0-.76-.053-1.467-.173-2.053H12.48z"/></svg>
          Google

  </main>

  <!-- Browser Frame Viewport -->
  <div class="modal" id="gameModal">
    <div class="modal-content">
      <div id="loaderBar" class="loader-bar"></div>
      
      <!-- Sleek Cyber Loading Overlay -->
      <div id="loadingOverlay" class="loading-overlay">
        <div class="cyber-spinner"></div>
        <div class="loading-text-wrapper">
          <div class="loading-brand">REGEN NODE</div>
          <div id="loadingStatus" class="loading-status">Routing through edge proxy...</div>
        </div>
      </div>

      <iframe id="gameFrame" src=""></iframe>
    </div>
  </div>

  <div id="toast" class="toast">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>
    <span id="toastMsg">URL copied to clipboard</span>
  </div>

  <script>
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');

    let particles = [];
    let mouse = { x: null, y: null, radius: 220 };
    const proxyBase = 'https://camp-doe-heroes-accent.trycloudflare.com/ixl/';

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    window.addEventListener('mousemove', (e) => {
      mouse.x = e.x;
      mouse.y = e.y;
    });

    window.addEventListener('mouseout', () => {
      mouse.x = null;
      mouse.y = null;
    });

    class Particle {
      constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 0.7 + 0.7;
        this.vx = (Math.random() - 0.5) * 0.3;
        this.vy = (Math.random() - 0.5) * 0.3;
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;

        if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
        if (this.y < 0 || this.y > canvas.height) this.vy *= -1;

        if (mouse.x && mouse.y) {
          let dx = mouse.x - this.x;
          let dy = mouse.y - this.y;
          let distance = Math.sqrt(dx * dx + dy * dy);
          if (distance < mouse.radius) {
            let force = (mouse.radius - distance) / mouse.radius;
            this.x -= (dx / distance) * force * 2;
            this.y -= (dy / distance) * force * 2;
          }
        }
      }

      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(211, 164, 255, 0.75)';
        ctx.fill();
      }
    }

    function initParticles() {
      particles = [];
      const count = Math.floor((canvas.width * canvas.height) / 12000);
      for (let i = 0; i < count; i++) {
        particles.push(new Particle());
      }
    }
    initParticles();
    window.addEventListener('resize', initParticles);

    function connectParticles() {
      for (let a = 0; a < particles.length; a++) {
        for (let b = a + 1; b < particles.length; b++) {
          let dx = particles[a].x - particles[b].x;
          let dy = particles[a].y - particles[b].y;
          let dist = Math.sqrt(dx * dx + dy * dy);

          if (dist < 115) {
            let opacity = (1 - dist / 115) * 0.12;
            ctx.strokeStyle = `rgba(187, 134, 252, ${opacity})`;
            ctx.lineWidth = 0.6;
            ctx.beginPath();
            ctx.moveTo(particles[a].x, particles[a].y);
            ctx.lineTo(particles[b].x, particles[b].y);
            ctx.stroke();
          }
        }
      }
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        p.update();
        p.draw();
      });
      connectParticles();
      requestAnimationFrame(animate);
    }
    animate();

    function isLikelyUrl(value) {
      const trimmed = value.trim();
      return /^(https?:\/\/|www\.)/i.test(trimmed) || (/\.[a-z]{2,}/i.test(trimmed) && !/\s/.test(trimmed));
    }

    const topBrowserBar = document.getElementById('topBrowserBar');
    const collapseHandle = document.getElementById('collapseHandle');
    const addressBar = document.getElementById('addressBar');
    const frame = document.getElementById('gameFrame');
    const loader = document.getElementById('loaderBar');
    const loadingOverlay = document.getElementById('loadingOverlay');
    const loadingStatus = document.getElementById('loadingStatus');
    const clearPillBtn = document.getElementById('clearPillBtn');
    
    let historyStack = [];
    let historyIndex = -1;
    let statusInterval;

    const statusMessages = [
      "Routing through edge proxy...",
      "Encrypting SSL payload...",
      "Resolving remote destination...",
      "Bypassing network filters...",
      "Finalizing handshake..."
    ];

    function startLoading() {
      loader.style.opacity = '1';
      loader.style.width = '20%';
      loadingOverlay.classList.add('active');
      
      let step = 0;
      loadingStatus.textContent = statusMessages[0];
      clearInterval(statusInterval);
      statusInterval = setInterval(() => {
        step = (step + 1) % statusMessages.length;
        loadingStatus.textContent = statusMessages[step];
      }, 700);

      setTimeout(() => { if (loadingOverlay.classList.contains('active')) loader.style.width = '65%'; }, 300);
      setTimeout(() => { if (loadingOverlay.classList.contains('active')) loader.style.width = '85%'; }, 900);
    }

    function finishLoading() {
      clearInterval(statusInterval);
      loader.style.width = '100%';
      setTimeout(() => {
        loadingOverlay.classList.remove('active');
        loader.style.opacity = '0';
        setTimeout(() => { loader.style.width = '0%'; }, 200);
      }, 250);
    }

    frame.addEventListener('load', finishLoading);

    function showToast(msg) {
      const toast = document.getElementById('toast');
      document.getElementById('toastMsg').textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2200);
    }

    function setAddressBarFromFrame() {
      const src = frame.src || '';
      if (!src.startsWith(proxyBase)) {
        addressBar.value = src;
        return;
      }
      try {
        const withoutProxy = decodeURIComponent(src.replace(proxyBase, ''));
        addressBar.value = withoutProxy;
      } catch {
        addressBar.value = src.replace(proxyBase, '');
      }
      clearPillBtn.style.display = addressBar.value ? 'flex' : 'none';
    }

    function pushHistory(url) {
      if (historyIndex >= 0 && historyStack[historyIndex] === url) return;
      historyStack = historyStack.slice(0, historyIndex + 1);
      historyStack.push(url);
      historyIndex = historyStack.length - 1;
    }

    function updateFrameFromHistory() {
      if (historyIndex < 0 || historyIndex >= historyStack.length) return;
      startLoading();
      frame.src = historyStack[historyIndex];
      setAddressBarFromFrame();
    }

    function toggleBrowserBar() {
      topBrowserBar.classList.toggle('hidden');
    }

    collapseHandle.addEventListener('click', toggleBrowserBar);

    document.getElementById('homeBtn').addEventListener('click', closeGame);

    document.getElementById('reloadBtn').addEventListener('click', () => {
      if (frame.src) {
        startLoading();
        const current = frame.src;
        frame.src = '';
        frame.src = current;
      }
    });

    document.getElementById('backBtn').addEventListener('click', () => {
      if (historyIndex > 0) {
        historyIndex -= 1;
        updateFrameFromHistory();
      }
    });

    document.getElementById('forwardBtn').addEventListener('click', () => {
      if (historyIndex < historyStack.length - 1) {
        historyIndex += 1;
        updateFrameFromHistory();
      }
    });

    document.getElementById('copyUrlBtn').addEventListener('click', () => {
      const urlToCopy = addressBar.value;
      if (urlToCopy) {
        navigator.clipboard.writeText(urlToCopy).then(() => {
          showToast("URL copied to clipboard!");
        });
      }
    });

    // Tab Cloaking Toggle
    let isCloaked = false;
    document.getElementById('cloakBtn').addEventListener('click', () => {
      if (!isCloaked) {
        document.title = "Home | Google Classroom";
        let link = document.querySelector("link[rel*='icon']") || document.createElement('link');
        link.type = 'image/x-icon';
        link.rel = 'shortcut icon';
        link.href = 'https://ssl.gstatic.com/classroom/favicon.png';
        document.head.appendChild(link);
        showToast("Cloaked as Google Classroom");
        isCloaked = true;
      } else {
        document.title = "Regen Unblocker";
        showToast("Tab restored");
        isCloaked = false;
      }
    });

    document.getElementById('fullscreenBtn').addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    });

    document.getElementById('newTabBtn').addEventListener('click', () => {
      if (frame.src) {
        window.open(frame.src, '_blank');
      }
    });

    document.getElementById('closeModalBtn').addEventListener('click', closeGame);

    addressBar.addEventListener('input', () => {
      clearPillBtn.style.display = addressBar.value ? 'flex' : 'none';
    });

    clearPillBtn.addEventListener('click', () => {
      addressBar.value = '';
      clearPillBtn.style.display = 'none';
      addressBar.focus();
    });

    addressBar.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') {
        event.preventDefault();
        openSearch(addressBar.value);
      }
    });

    addressBar.addEventListener('focus', () => {
      addressBar.select();
      clearPillBtn.style.display = addressBar.value ? 'flex' : 'none';
    });

    function openGame(title, url) {
      startLoading();
      pushHistory(url);
      frame.src = url;
      document.getElementById('gameModal').classList.add('active');
      topBrowserBar.classList.remove('hidden');
      setAddressBarFromFrame();
    }

    function closeGame() {
      frame.src = '';
      finishLoading();
      document.getElementById('gameModal').classList.remove('active');
      topBrowserBar.classList.add('hidden');
    }

    function openSearch(query) {
      const value = (query || '').trim();
      if (!value) return;

      if (isLikelyUrl(value)) {
        const finalUrl = /^https?:\/\//i.test(value) ? value : 'https://' + value;
        const proxiedUrl = proxyBase + encodeURIComponent(finalUrl);
        openGame('Proxy Page', proxiedUrl);
        return;
      }

      const ddgUrl = 'https://duckduckgo.com/?q=' + encodeURIComponent(value);
      const proxiedDdgo = proxyBase + encodeURIComponent(ddgUrl);
      openGame('DuckDuckGo', proxiedDdgo);
    }

    document.getElementById('searchInput').addEventListener('keydown', (event) => {
      if (event.key === 'Enter') {
        event.preventDefault();
        openSearch(event.target.value);
      }
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeGame();
    });
  </script>
</body>
