<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="no-referrer" />
  <title>Google Classroom</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;0,14..32,800;1,14..32,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:          #03070c;
      --surface:     rgba(10, 18, 28, 0.88);
      --border:      rgba(119, 183, 223, 0.18);
      --border-hi:   rgba(119, 183, 223, 0.55);
      --ink:         #e8f2fa;
      --ink-muted:   #7a9ab0;
      --accent:      #77b7df;
      --accent-soft: rgba(119, 183, 223, 0.14);
      --green:       #34d399;
      --radius-sm:   6px;
      --radius:      10px;
      --radius-lg:   14px;
    }
    html, body {
      width: 100%; min-height: 100%;
      background: var(--bg); color: var(--ink);
      font-family: 'Inter', system-ui, sans-serif;
      overflow-x: hidden;
    }
    button { font: inherit; cursor: pointer; border: none; background: transparent; color: inherit; }
    a { color: inherit; text-decoration: none; }

    /* ── Background (identical to index.html) ───────────────────── */
    #bg-canvas { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
    #vanta     { position: fixed; inset: 0; z-index: 0; filter: blur(7px) saturate(0.72); transform: scale(1.08); opacity: 0.72; pointer-events: none; }
    #stars     { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; opacity: 0.6; }

    /* ── Layout ─────────────────────────────────────────────────── */
    .shell {
      position: relative; z-index: 2;
      width: min(1060px, calc(100% - 2.5rem));
      min-height: 100vh; margin: 0 auto;
      padding: 3.5rem 0 4rem;
      display: flex; flex-direction: column; align-items: center;
      animation: fadeUp 0.4s cubic-bezier(0.16,1,0.3,1) both;
    }
    @keyframes fadeUp { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:translateY(0); } }

    /* ── Header ─────────────────────────────────────────────────── */
    .cloud-header { display: flex; flex-direction: column; align-items: center; text-align: center; margin-bottom: 2rem; width: 100%; }
    .cloud-logo { width: min(200px,55vw); max-height: 72px; object-fit: contain; margin-bottom: 1.2rem; filter: drop-shadow(0 0 22px rgba(119,183,223,0.28)); }
    .header-rule { width: min(300px,52%); height: 1px; background: linear-gradient(90deg,transparent,var(--accent),transparent); opacity: 0.4; margin-bottom: 2rem; }

    /* ── Search (identical to index.html) ───────────────────────── */
    .search-wrap { position: relative; width: 100%; max-width: 560px; margin-bottom: 1.5rem; }
    .search-icon { position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; fill: none; stroke: var(--ink-muted); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
    .search-bar { width: 100%; height: 54px; padding: 0 1rem 0 2.8rem; border: 1px solid var(--border); border-radius: var(--radius); background: rgba(5,12,20,0.82); backdrop-filter: blur(18px); color: var(--ink); font-size: 0.92rem; outline: none; box-shadow: 0 8px 32px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.05); transition: border-color 0.2s, box-shadow 0.2s; }
    .search-bar::placeholder { color: rgba(255,255,255,0.25); }
    .search-bar:focus { border-color: var(--border-hi); box-shadow: 0 0 0 3px rgba(119,183,223,0.14), 0 12px 36px rgba(0,0,0,0.38); }

    /* ── Category pills ──────────────────────────────────────────── */
    .cat-row { display: flex; flex-wrap: wrap; gap: 0.4rem; justify-content: center; margin-bottom: 1.8rem; }
    .cat-pill { padding: 0.28rem 0.8rem; border: 1px solid var(--border); border-radius: 999px; background: transparent; color: var(--ink-muted); font-size: 0.66rem; font-weight: 600; cursor: pointer; transition: all 0.15s; white-space: nowrap; }
    .cat-pill:hover, .cat-pill.active { border-color: var(--border-hi); background: var(--accent-soft); color: var(--accent); }

    /* ── Games grid ──────────────────────────────────────────────── */
    .games-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1rem; width: 100%; }

    /* ── Game card ───────────────────────────────────────────────── */
    .game-card {
      position: relative; display: flex; flex-direction: column; overflow: hidden;
      min-height: 190px; padding: 1.1rem 1rem;
      border: 1px solid var(--border); border-radius: var(--radius-lg);
      background: var(--surface);
      box-shadow: 0 16px 38px rgba(0,0,0,0.28), inset 0 1px 0 rgba(255,255,255,0.05);
      color: var(--ink); cursor: pointer; isolation: isolate;
      transition: transform 200ms ease, border-color 200ms ease, box-shadow 200ms ease;
      --ca: var(--accent); --cg: rgba(119,183,223,0.16);
    }
    .game-card::before { content:''; position:absolute; inset:0; z-index:0; pointer-events:none; background:radial-gradient(circle at 50% 0%,var(--cg),transparent 60%); opacity:0.45; transition:opacity 200ms; }
    .game-card:hover, .game-card:focus-visible { outline:none; border-color:color-mix(in srgb,var(--ca) 58%,transparent); box-shadow:0 22px 50px rgba(0,0,0,0.36),0 0 26px color-mix(in srgb,var(--ca) 12%,transparent); transform:translateY(-4px); }
    .game-card:hover::before { opacity:0.82; }

    .card-blue   { --ca:#77b7df; --cg:rgba(119,183,223,0.18); }
    .card-green  { --ca:#34d399; --cg:rgba(52,211,153,0.18); }
    .card-yellow { --ca:#fbbf24; --cg:rgba(251,191,36,0.18); }
    .card-purple { --ca:#a78bfa; --cg:rgba(167,139,250,0.18); }
    .card-red    { --ca:#f87171; --cg:rgba(248,113,113,0.18); }
    .card-cyan   { --ca:#22d3ee; --cg:rgba(34,211,238,0.18); }
    .card-orange { --ca:#fb923c; --cg:rgba(251,146,60,0.18); }
    .card-pink   { --ca:#f472b6; --cg:rgba(244,114,182,0.18); }

    .card-body { position:relative; z-index:1; display:flex; flex-direction:column; gap:0.55rem; flex:1; }

    /* Logo image — shown when it loads; fallback SVG shown when it errors */
    .card-logo-wrap {
      width: 52px; height: 52px; border-radius: var(--radius);
      border: 1px solid rgba(255,255,255,0.11);
      background: rgba(4,10,18,0.6);
      overflow: hidden; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      color: var(--ca);
    }
    .card-logo-img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .card-logo-svg { width: 60%; height: 60%; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; }
    .card-logo-img.hidden { display: none; }
    .card-logo-svg.hidden { display: none; }

    .card-name { color: var(--ink); font-size: 1rem; font-weight: 700; letter-spacing: -0.02em; margin-top: auto; }
    .card-foot { display: flex; align-items: center; justify-content: space-between; }
    .card-tag  { color: var(--ink-muted); font-size: 0.6rem; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; }
    .card-arrow { width: 20px; height: 20px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.11); background: rgba(255,255,255,0.04); display: flex; align-items: center; justify-content: center; color: var(--ca); font-size: 0.75rem; transition: background 0.15s, border-color 0.15s; }
    .game-card:hover .card-arrow { background: var(--accent-soft); border-color: var(--border-hi); }

    /* ── Empty state ─────────────────────────────────────────────── */
    .empty-state { display: none; flex-direction: column; align-items: center; gap: 0.55rem; padding: 3rem; color: var(--ink-muted); text-align: center; font-size: 0.8rem; }
    .empty-state svg { width: 34px; height: 34px; fill: none; stroke: var(--ink-muted); stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; opacity: 0.45; }

    /* ── Viewer ──────────────────────────────────────────────────── */
    .viewer { position: fixed; inset: 0; z-index: 50; background: #000; display: none; }
    .viewer.open { display: block; }
    .viewer-frame { width: 100%; height: 100%; border: none; }
    .viewer-close { position: absolute; top: 14px; right: 14px; z-index: 60; width: 34px; height: 34px; border-radius: var(--radius-sm); border: 1px solid rgba(255,255,255,0.18); background: rgba(8,16,26,0.92); backdrop-filter: blur(12px); color: var(--ink); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: background 0.14s, border-color 0.14s; }
    .viewer-close:hover { background: rgba(248,113,113,0.18); border-color: rgba(248,113,113,0.45); color: #f87171; }
    .viewer-close svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; }

    /* Loading bar inside viewer */
    .viewer-bar { position: absolute; top: 0; left: 0; height: 2px; width: 0%; background: linear-gradient(90deg,#77b7df,#a9d5f2); box-shadow: 0 0 8px rgba(119,183,223,0.7); z-index: 61; transition: width 0.3s ease, opacity 0.3s ease; }

    /* ── Responsive ──────────────────────────────────────────────── */
    @media (max-width: 620px) {
      .shell { width: calc(100% - 1.5rem); padding: 2.5rem 0 3rem; }
      .games-grid { grid-template-columns: 1fr 1fr; gap: 0.75rem; }
      .game-card { min-height: 160px; padding: 0.9rem; }
    }
    @media (max-width: 400px) { .games-grid { grid-template-columns: 1fr; } }

    .game-card { animation: fadeUp 0.35s cubic-bezier(0.16,1,0.3,1) both; }
  </style>
</head>
<body>
  <canvas id="bg-canvas"></canvas>
  <div id="vanta" aria-hidden="true"></div>
  <canvas id="stars" aria-hidden="true"></canvas>

  <div class="shell">
    <header class="cloud-header">
      <img class="cloud-logo" src="Lunar-proxy.png" alt="Lunar Proxy" />
      <div class="header-rule"></div>
    </header>

    <div class="search-wrap">
      <svg class="search-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="cloudSearch" class="search-bar" type="text"
        placeholder="Search games…" autocomplete="off" spellcheck="false" />
    </div>

    <div class="cat-row" id="catRow">
      <button class="cat-pill active" data-cat="all">All</button>
      <button class="cat-pill" data-cat="mobile">Mobile</button>
      <button class="cat-pill" data-cat="action">Action</button>
      <button class="cat-pill" data-cat="puzzle">Puzzle</button>
      <button class="cat-pill" data-cat="io">IO</button>
    </div>

    <section class="games-grid" id="gamesGrid" aria-label="Games"></section>
    <div class="empty-state" id="emptyState">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m16.5 16.5 4 4"/></svg>
      No games matched your search.
    </div>
  </div>

  <div id="viewer" class="viewer" aria-hidden="true">
    <div id="viewerBar" class="viewer-bar"></div>
    <button id="viewerClose" class="viewer-close" aria-label="Close game">
      <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
    <iframe id="viewerFrame" class="viewer-frame" title="Game player"
      allow="fullscreen; autoplay" referrerpolicy="no-referrer"></iframe>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js" referrerpolicy="no-referrer" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/vanta@0.5.24/dist/vanta.fog.min.js" referrerpolicy="no-referrer" defer></script>
  <script>
  (() => {
    /* ── Game catalogue ───────────────────────────────────────────────
       All URLs use crazygames.com/embed/<slug> — CrazyGames explicitly
       supports embedding and their /embed/ pages have no X-Frame-Options
       block. Thumbnails use their public image CDN.
       The proxy is still used so the connection goes through Cloudflare.
    ──────────────────────────────────────────────────────────────── */
    const CG = 'https://www.crazygames.com/embed/';
    const THUMB = s => `https://imgs.crazygames.com/games/${s}/cover_16x9.png`;

    const GAMES = [
      {
        name: 'Smash Karts',
        slug: 'smash-karts',
        cat: 'action', color: 'card-purple', tag: 'Battle Racing',
        fallback: `<svg stroke-width="2" viewBox="0 0 24 24"><path d="M3 17h3l2-6h8l2 6h3" stroke="currentColor" fill="none" stroke-linecap="round"/><circle cx="7.5" cy="17.5" r="1.5" fill="currentColor" stroke="none"/><circle cx="16.5" cy="17.5" r="1.5" fill="currentColor" stroke="none"/></svg>`
      },
      {
        name: 'Shell Shockers',
        slug: 'shellshockersio',
        cat: 'action', color: 'card-yellow', tag: 'FPS Multiplayer',
        fallback: `<svg stroke-width="2" viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="7" ry="8" fill="currentColor" stroke="none"/><circle cx="10" cy="10" r="1.5" fill="rgba(3,7,12,0.6)" stroke="none"/><path d="M15 8l1-3" stroke="rgba(3,7,12,0.7)" stroke-linecap="round"/></svg>`
      },
      {
        name: 'Bullet Force',
        slug: 'bullet-force-multiplayer',
        cat: 'action', color: 'card-red', tag: 'FPS Multiplayer',
        fallback: `<svg stroke-width="2" viewBox="0 0 24 24"><path d="M5 12h14M14 7l5 5-5 5" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`
      },
      {
        name: 'Slope',
        slug: 'slope',
        cat: 'action', color: 'card-cyan', tag: 'Skill',
        fallback: `<svg stroke-width="2" viewBox="0 0 24 24"><path d="M3 20 10 6l4 7 3-4 4 11" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`
      },
      {
        name: 'PolyTrack',
        slug: 'polytrack',
        cat: 'action', color: 'card-orange', tag: 'Racing',
        fallback: `<svg stroke-width="2" viewBox="0 0 24 24"><path d="M3 17h3l2-8h8l2 8h3M5 9h14" stroke="currentColor" fill="none" stroke-linecap="round"/></svg>`
      },
      {
        name: 'Krunker',
        slug: 'krunker',
        cat: 'action', color: 'card-green', tag: 'FPS IO',
        fallback: `<svg stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="8" rx="2" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="2" fill="rgba(3,7,12,0.6)" stroke="none"/><path d="M8 8V6m4-2v4m4-4v4" stroke="currentColor" stroke-linecap="round"/></svg>`
      },
      {
        name: 'Minecraft Classic',
        slug: 'minecraft-classic',
        cat: 'puzzle', color: 'card-green', tag: 'Sandbox',
        fallback: `<svg stroke-width="1.8" viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="1" fill="currentColor" stroke="none"/><rect x="13" y="3" width="8" height="8" rx="1" fill="currentColor" stroke="none" opacity="0.7"/><rect x="3" y="13" width="8" height="8" rx="1" fill="currentColor" stroke="none" opacity="0.7"/><rect x="13" y="13" width="8" height="8" rx="1" fill="currentColor" stroke="none"/></svg>`
      },
      {
        name: 'Moto X3M',
        slug: 'moto-x3m',
        cat: 'action', color: 'card-orange', tag: 'Bike Racing',
        fallback: `<svg stroke-width="2" viewBox="0 0 24 24"><circle cx="6" cy="17" r="3" stroke="currentColor" fill="none"/><circle cx="18" cy="17" r="3" stroke="currentColor" fill="none"/><path d="M6 17 9 9h5l3 5-4 3" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`
      },
      {
        name: 'Ragdoll Archers',
        slug: 'ragdoll-archers',
        cat: 'action', color: 'card-blue', tag: 'Archery',
        fallback: `<svg stroke-width="2" viewBox="0 0 24 24"><path d="m5 19 14-14M15 5l4 0 0 4" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="6" cy="18" r="2" fill="currentColor" stroke="none"/></svg>`
      },
      {
        name: 'Venge.io',
        slug: 'vengeio',
        cat: 'action', color: 'card-red', tag: 'FPS IO',
        fallback: `<svg stroke-width="2" viewBox="0 0 24 24"><path d="M12 2 2 7l10 5 10-5-10-5Z" fill="currentColor" stroke="none"/><path d="M2 17l10 5 10-5M2 12l10 5 10-5" stroke="currentColor" fill="none" stroke-linecap="round"/></svg>`
      },
      {
        name: 'EvoWars.io',
        slug: 'evowarsio',
        cat: 'io', color: 'card-purple', tag: 'IO Game',
        fallback: `<svg stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="9" stroke="currentColor" fill="none"/><path d="M12 3v3m0 12v3M3 12h3m12 0h3" stroke="currentColor" stroke-linecap="round"/></svg>`
      },
      {
        name: 'Stickman Warriors',
        slug: 'stickman-warriors',
        cat: 'action', color: 'card-pink', tag: 'Fighting',
        fallback: `<svg stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="5" r="2" fill="currentColor" stroke="none"/><path d="M12 7v6M9 10l-3 4m6-3 3 4m-6 0v4m-2 0h4" stroke="currentColor" stroke-linecap="round"/></svg>`
      },
    ];

    /* ── Vanta ─────────────────────────────────────────────────────── */
    window.addEventListener('load', () => {
      if (window.VANTA?.FOG) {
        VANTA.FOG({
          el: '#vanta', mouseControls: true, touchControls: true,
          gyroControls: false, minHeight: 200, minWidth: 200,
          highlightColor: 0x2a5570, midtoneColor: 0x132230,
          lowlightColor: 0x060e16, baseColor: 0x030a12,
          blurFactor: 0.72, speed: 0.7, zoom: 0.88
        });
      }
    });

    /* ── Stars ─────────────────────────────────────────────────────── */
    (() => {
      const cvs = document.getElementById('stars');
      const ctx = cvs.getContext('2d');
      const stars = [];
      let W, H;
      function resize() { W = cvs.width = innerWidth; H = cvs.height = innerHeight; }
      function seed() {
        stars.length = 0;
        const n = Math.min(80, Math.max(30, Math.floor(W * H / 22000)));
        for (let i = 0; i < n; i++)
          stars.push({ x: Math.random()*W, y: Math.random()*H, r: Math.random()*0.6+0.3, s: Math.random()*0.15+0.05, o: Math.random()*0.18+0.08, p: Math.random()*Math.PI*2 });
      }
      function draw(t) {
        ctx.clearRect(0, 0, W, H);
        for (const s of stars) {
          s.y -= s.s;
          if (s.y < 0) s.y = H + s.r;
          const a = s.o + Math.sin(t * 0.0006 + s.p) * 0.04;
          ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
          ctx.fillStyle = `rgba(160,210,240,${Math.max(0.04, a)})`; ctx.fill();
        }
        requestAnimationFrame(draw);
      }
      resize(); seed();
      window.addEventListener('resize', () => { resize(); seed(); });
      requestAnimationFrame(draw);
    })();

    /* ── Particles ─────────────────────────────────────────────────── */
    (() => {
      const cvs = document.getElementById('bg-canvas');
      const ctx = cvs.getContext('2d');
      let parts = [], mouse = { x: null, y: null, r: 200 };
      function resize() { cvs.width = innerWidth; cvs.height = innerHeight; }
      resize(); window.addEventListener('resize', () => { resize(); init(); });
      window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
      window.addEventListener('mouseout',  () => { mouse.x = null; mouse.y = null; });
      class P {
        constructor() { this.reset(); }
        reset() { this.x = Math.random()*cvs.width; this.y = Math.random()*cvs.height; this.size = Math.random()*0.65+0.45; this.vx = (Math.random()-0.5)*0.28; this.vy = (Math.random()-0.5)*0.28; }
        step() {
          this.x += this.vx; this.y += this.vy;
          if (this.x < 0 || this.x > cvs.width)  this.vx *= -1;
          if (this.y < 0 || this.y > cvs.height) this.vy *= -1;
          if (mouse.x != null) { const dx=mouse.x-this.x, dy=mouse.y-this.y, d=Math.hypot(dx,dy); if (d>0&&d<mouse.r) { const f=(mouse.r-d)/mouse.r; this.x-=dx/d*f*1.8; this.y-=dy/d*f*1.8; } }
        }
        draw() { ctx.beginPath(); ctx.arc(this.x,this.y,this.size,0,Math.PI*2); ctx.fillStyle='rgba(100,162,200,0.45)'; ctx.fill(); }
      }
      function init() { parts=[]; const n=Math.floor(cvs.width*cvs.height/14000); for(let i=0;i<n;i++) parts.push(new P()); }
      init();
      function loop() {
        ctx.clearRect(0,0,cvs.width,cvs.height);
        for(const p of parts){p.step();p.draw();}
        for(let i=0;i<parts.length;i++) for(let j=i+1;j<parts.length;j++){const dx=parts[i].x-parts[j].x,dy=parts[i].y-parts[j].y,d=Math.hypot(dx,dy);if(d<110){ctx.strokeStyle=`rgba(100,162,200,${(1-d/110)*0.05})`;ctx.lineWidth=0.5;ctx.beginPath();ctx.moveTo(parts[i].x,parts[i].y);ctx.lineTo(parts[j].x,parts[j].y);ctx.stroke();}}
        requestAnimationFrame(loop);
      }
      loop();
    })();

    /* ── Build cards ───────────────────────────────────────────────── */
    function buildCards(list) {
      const grid  = document.getElementById('gamesGrid');
      const empty = document.getElementById('emptyState');
      grid.innerHTML = '';
      if (!list.length) { empty.style.display = 'flex'; return; }
      empty.style.display = 'none';
      list.forEach((g, i) => {
        const embedUrl = CG + g.slug;
        const thumbUrl = THUMB(g.slug);
        const card = document.createElement('button');
        card.className = `game-card ${g.color}`;
        card.type = 'button';
        card.style.animationDelay = `${i * 35}ms`;
        card.innerHTML = `
          <div class="card-body">
            <div class="card-logo-wrap">
              <img class="card-logo-img"
                src="${thumbUrl}"
                alt="${g.name}"
                onerror="this.classList.add('hidden');this.nextElementSibling.classList.remove('hidden')"
              />
              <svg class="card-logo-svg hidden" viewBox="0 0 24 24"
                stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8">
                ${g.fallback}
              </svg>
            </div>
            <div class="card-name">${g.name}</div>
            <div class="card-foot">
              <span class="card-tag">${g.tag}</span>
              <span class="card-arrow">→</span>
            </div>
          </div>`;
        // Pass the direct CrazyGames embed URL — no proxy needed since
        // CrazyGames /embed/ pages allow iframing from any origin.
        card.addEventListener('click', () => openGame(embedUrl));
        grid.appendChild(card);
      });
    }
    buildCards(GAMES);

    /* ── Filter ────────────────────────────────────────────────────── */
    let activeCat = 'all', searchQuery = '';
    function applyFilter() {
      const q = searchQuery.toLowerCase();
      buildCards(GAMES.filter(g =>
        (activeCat === 'all' || g.cat === activeCat) &&
        (!q || g.name.toLowerCase().includes(q) || g.tag.toLowerCase().includes(q))
      ));
    }
    document.getElementById('cloudSearch').addEventListener('input', e => { searchQuery = e.target.value; applyFilter(); });
    document.getElementById('catRow').addEventListener('click', e => {
      const pill = e.target.closest('.cat-pill');
      if (!pill) return;
      document.querySelectorAll('.cat-pill').forEach(p => p.classList.remove('active'));
      pill.classList.add('active');
      activeCat = pill.dataset.cat;
      applyFilter();
    });

    /* ── Viewer with loading bar ───────────────────────────────────── */
    const viewer      = document.getElementById('viewer');
    const viewerFrame = document.getElementById('viewerFrame');
    const viewerBar   = document.getElementById('viewerBar');

    function openGame(url) {
      // CrazyGames /embed/ pages allow framing from any origin — load directly,
      // no proxy needed. This is faster and avoids double-encoding issues.
      viewerBar.style.transition = 'none';
      viewerBar.style.width = '0%';
      viewerBar.style.opacity = '1';
      viewerFrame.src = '';
      viewer.classList.add('open');
      viewer.setAttribute('aria-hidden', 'false');
      requestAnimationFrame(() => {
        viewerBar.style.transition = 'width 0.4s ease';
        viewerBar.style.width = '35%';
        setTimeout(() => { viewerBar.style.width = '70%'; }, 450);
        setTimeout(() => { viewerBar.style.width = '88%'; }, 1000);
        viewerFrame.src = url;
      });
    }

    viewerFrame.addEventListener('load', () => {
      viewerBar.style.width = '100%';
      setTimeout(() => { viewerBar.style.opacity = '0'; setTimeout(() => { viewerBar.style.width = '0%'; }, 200); }, 220);
    });

    function closeGame() {
      viewerFrame.src = '';
      viewer.classList.remove('open');
      viewer.setAttribute('aria-hidden', 'true');
      viewerBar.style.opacity = '0';
      viewerBar.style.width = '0%';
    }
    document.getElementById('viewerClose').addEventListener('click', closeGame);
    window.addEventListener('keydown', e => { if (e.key === 'Escape') closeGame(); });
  })();
  </script>
</body>
</html>
