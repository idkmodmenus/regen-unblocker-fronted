<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="no-referrer" />
  <title>Lunar Cloud</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;0,14..32,800&display=swap" rel="stylesheet">
  <style>
    /* ─── RESET & DESIGN TOKENS ──────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:          #03070c;
      --surface:     rgba(10, 18, 28, 0.88);
      --surface2:    rgba(14, 26, 40, 0.92);
      --border:      rgba(119, 183, 223, 0.18);
      --border-hi:   rgba(119, 183, 223, 0.55);
      --ink:         #e8f2fa;
      --ink-muted:   #7a9ab0;
      --accent:      #77b7df;
      --accent-soft: rgba(119, 183, 223, 0.14);
      --green:       #34d399;
      --yellow:      #fbbf24;
      --radius-sm:   6px;
      --radius:      10px;
      --radius-lg:   14px;
    }
    html, body {
      width: 100%; min-height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: 'Inter', system-ui, sans-serif;
      overflow-x: hidden;
    }

    /* ─── BACKGROUND LAYERS ──────────────────────────────────────── */
    #vanta {
      position: fixed; inset: 0; z-index: 0;
      filter: blur(8px) saturate(0.7);
      transform: scale(1.08); opacity: 0.7;
      pointer-events: none;
    }
    #stars {
      position: fixed; inset: 0; width: 100%; height: 100%;
      z-index: 1; pointer-events: none; opacity: 0.55;
    }

    /* ─── LAYOUT SHELL ───────────────────────────────────────────── */
    .shell {
      position: relative; z-index: 2;
      width: min(1060px, calc(100% - 2.5rem));
      min-height: 100vh;
      margin: 0 auto;
      padding: 5rem 0 4rem;
      display: flex; flex-direction: column; align-items: center;
    }

    /* ─── HEADER ─────────────────────────────────────────────────── */
    .cloud-header {
      display: flex; flex-direction: column; align-items: center;
      text-align: center; margin-bottom: 2.8rem;
    }
    .header-badge {
      display: inline-flex; align-items: center; gap: 0.45rem;
      margin-bottom: 1rem; padding: 0.28rem 0.75rem;
      border: 1px solid var(--border); border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent); font-size: 0.65rem; font-weight: 700;
      letter-spacing: 0.16em; text-transform: uppercase;
    }
    .header-badge svg { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .cloud-title {
      color: var(--ink); font-size: clamp(2rem, 5vw, 3.2rem);
      font-weight: 800; letter-spacing: -0.04em; line-height: 1.06;
      text-shadow: 0 8px 28px rgba(0,0,0,0.45);
      margin-bottom: 0.55rem;
    }
    .cloud-title-accent {
      color: var(--accent);
    }
    .cloud-subtitle {
      color: var(--ink-muted); font-size: 0.88rem; max-width: 440px; line-height: 1.5;
    }
    .header-rule {
      width: min(320px, 55%); height: 1px; margin: 1.4rem auto 0;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      opacity: 0.45;
    }

    /* ─── SEARCH BAR ─────────────────────────────────────────────── */
    .cloud-search-wrap {
      position: relative; width: 100%; max-width: 520px;
      margin-bottom: 2.4rem;
    }
    .cloud-search-icon {
      position: absolute; left: 1rem; top: 50%; transform: translateY(-50%);
      width: 15px; height: 15px; fill: none; stroke: var(--ink-muted);
      stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round;
      pointer-events: none;
    }
    .cloud-search {
      width: 100%; height: 48px; padding: 0 1rem 0 2.7rem;
      border: 1px solid var(--border); border-radius: var(--radius);
      background: rgba(5, 12, 20, 0.72); backdrop-filter: blur(14px);
      color: var(--ink); font-size: 0.88rem; outline: none;
      box-shadow: 0 8px 24px rgba(0,0,0,0.28), inset 0 1px 0 rgba(255,255,255,0.04);
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .cloud-search::placeholder { color: rgba(255,255,255,0.25); }
    .cloud-search:focus {
      border-color: var(--border-hi);
      box-shadow: 0 0 0 3px rgba(119,183,223,0.12), 0 10px 28px rgba(0,0,0,0.32);
    }

    /* ─── CATEGORY PILLS ─────────────────────────────────────────── */
    .category-row {
      display: flex; flex-wrap: wrap; gap: 0.45rem;
      justify-content: center; margin-bottom: 1.8rem;
    }
    .cat-pill {
      padding: 0.3rem 0.85rem; border: 1px solid var(--border);
      border-radius: 999px; background: transparent;
      color: var(--ink-muted); font-size: 0.68rem; font-weight: 600;
      cursor: pointer; transition: all 0.16s; white-space: nowrap;
    }
    .cat-pill:hover, .cat-pill.active {
      border-color: var(--border-hi); background: var(--accent-soft); color: var(--accent);
    }

    /* ─── GAMES GRID ─────────────────────────────────────────────── */
    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 1rem; width: 100%;
    }

    /* ─── GAME CARD ──────────────────────────────────────────────── */
    .game-card {
      position: relative; display: flex; flex-direction: column;
      min-height: 200px; overflow: hidden;
      border: 1px solid var(--border); border-radius: var(--radius-lg);
      background: var(--surface);
      box-shadow: 0 16px 38px rgba(0,0,0,0.28), inset 0 1px 0 rgba(255,255,255,0.05);
      color: var(--ink); cursor: pointer; isolation: isolate;
      transition: transform 200ms ease, border-color 200ms ease, box-shadow 200ms ease;
      padding: 1.2rem 1.1rem;
      /* CSS var for per-card accent color */
      --card-accent: var(--accent);
      --card-glow:   rgba(119, 183, 223, 0.16);
    }
    .game-card::before {
      content: ''; position: absolute; inset: 0; z-index: 0; pointer-events: none;
      background: radial-gradient(circle at 50% 0%, var(--card-glow), transparent 60%);
      opacity: 0.5; transition: opacity 200ms;
    }
    .game-card:hover, .game-card:focus-visible {
      outline: none;
      border-color: color-mix(in srgb, var(--card-accent) 60%, transparent);
      box-shadow: 0 22px 50px rgba(0,0,0,0.36), 0 0 26px color-mix(in srgb, var(--card-accent) 12%, transparent);
      transform: translateY(-4px);
    }
    .game-card:hover::before { opacity: 0.85; }

    /* Card accent variants */
    .game-card.card-blue    { --card-accent: #77b7df; --card-glow: rgba(119, 183, 223, 0.18); }
    .game-card.card-green   { --card-accent: #34d399; --card-glow: rgba(52, 211, 153, 0.18); }
    .game-card.card-yellow  { --card-accent: #fbbf24; --card-glow: rgba(251, 191, 36, 0.18); }
    .game-card.card-purple  { --card-accent: #a78bfa; --card-glow: rgba(167, 139, 250, 0.18); }
    .game-card.card-red     { --card-accent: #f87171; --card-glow: rgba(248, 113, 113, 0.18); }
    .game-card.card-cyan    { --card-accent: #22d3ee; --card-glow: rgba(34, 211, 238, 0.18); }
    .game-card.card-orange  { --card-accent: #fb923c; --card-glow: rgba(251, 146, 60, 0.18); }
    .game-card.card-pink    { --card-accent: #f472b6; --card-glow: rgba(244, 114, 182, 0.18); }

    .card-body {
      position: relative; z-index: 1;
      display: flex; flex-direction: column; gap: 0.65rem; flex: 1;
    }
    .card-icon-wrap {
      width: 52px; height: 52px; padding: 0.85rem;
      border: 1px solid rgba(255,255,255,0.12); border-radius: var(--radius);
      background: rgba(4, 10, 18, 0.55);
      color: var(--card-accent);
      filter: drop-shadow(0 6px 14px rgba(0,0,0,0.3));
      display: flex; align-items: center; justify-content: center;
    }
    .card-icon-wrap svg { display: block; width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; }
    .card-name { color: var(--ink); font-size: 1.05rem; font-weight: 700; letter-spacing: -0.02em; margin-top: auto; }
    .card-meta {
      display: flex; align-items: center; justify-content: space-between;
      margin-top: 0.2rem;
    }
    .card-tag {
      color: var(--ink-muted); font-size: 0.62rem; font-weight: 600;
      letter-spacing: 0.12em; text-transform: uppercase;
    }
    .card-arrow {
      width: 22px; height: 22px; border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.05);
      display: flex; align-items: center; justify-content: center;
      color: var(--card-accent); font-size: 0.8rem;
      transition: background 0.15s, border-color 0.15s;
    }
    .game-card:hover .card-arrow {
      background: var(--accent-soft); border-color: var(--border-hi);
    }

    /* ─── GAME VIEWER OVERLAY ────────────────────────────────────── */
    .viewer {
      position: fixed; inset: 0; z-index: 50;
      background: #000; display: none;
    }
    .viewer.open { display: block; }
    .viewer-frame { width: 100%; height: 100%; border: none; }

    /* Close button */
    .viewer-close {
      position: absolute; top: 14px; right: 14px; z-index: 60;
      width: 36px; height: 36px; border-radius: var(--radius-sm);
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(8, 16, 26, 0.92); backdrop-filter: blur(12px);
      color: var(--ink); display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: background 0.15s, border-color 0.15s;
    }
    .viewer-close:hover { background: rgba(248,113,113,0.2); border-color: rgba(248,113,113,0.5); color: #f87171; }
    .viewer-close svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; }

    /* ─── EMPTY STATE ────────────────────────────────────────────── */
    .empty-state {
      display: none; flex-direction: column; align-items: center; gap: 0.6rem;
      padding: 3rem; color: var(--ink-muted); text-align: center; font-size: 0.82rem;
    }
    .empty-state svg { width: 36px; height: 36px; fill: none; stroke: var(--ink-muted); stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; opacity: 0.5; }

    /* ─── RESPONSIVE ─────────────────────────────────────────────── */
    @media (max-width: 620px) {
      .shell { width: calc(100% - 1.5rem); padding: 3.5rem 0 3rem; }
      .games-grid { grid-template-columns: 1fr 1fr; gap: 0.75rem; }
      .game-card { min-height: 170px; padding: 1rem; }
    }
    @media (max-width: 400px) {
      .games-grid { grid-template-columns: 1fr; }
    }

    /* ─── FADE-IN ANIMATION ─────────────────────────────────────── */
    @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    .shell { animation: fadeUp 0.4s cubic-bezier(0.16,1,0.3,1) both; }
    .game-card { animation: fadeUp 0.35s cubic-bezier(0.16,1,0.3,1) both; }
  </style>
</head>
<body>
  <div id="vanta" aria-hidden="true"></div>
  <canvas id="stars" aria-hidden="true"></canvas>

  <div class="shell">
    <!-- Header -->
    <header class="cloud-header">
      <div class="header-badge">
        <svg viewBox="0 0 24 24"><path d="M7.5 18h9a4.5 4.5 0 0 0 .8-8.93A5.5 5.5 0 0 0 6.2 8.1 4 4 0 0 0 7.5 18Z"/></svg>
        Lunar Cloud
      </div>
      <h1 class="cloud-title"><span class="cloud-title-accent">Lunar</span> Cloud</h1>
      <p class="cloud-subtitle">Play instantly — no installs, no accounts, no restrictions.</p>
      <div class="header-rule"></div>
    </header>

    <!-- Search -->
    <div class="cloud-search-wrap">
      <svg class="cloud-search-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m16.5 16.5 4 4"/></svg>
      <input id="cloudSearch" class="cloud-search" type="text" placeholder="Search games…" autocomplete="off" />
    </div>

    <!-- Category pills -->
    <div class="category-row" id="catRow">
      <button class="cat-pill active" data-cat="all">All</button>
      <button class="cat-pill" data-cat="mobile">Mobile</button>
      <button class="cat-pill" data-cat="action">Action</button>
      <button class="cat-pill" data-cat="puzzle">Puzzle</button>
      <button class="cat-pill" data-cat="io">IO</button>
    </div>

    <!-- Games grid -->
    <section class="games-grid" id="gamesGrid" aria-label="Games"></section>
    <div class="empty-state" id="emptyState">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m16.5 16.5 4 4"/></svg>
      No games matched your search.
    </div>
  </div>

  <!-- Game viewer -->
  <div id="viewer" class="viewer" aria-hidden="true">
    <button id="viewerClose" class="viewer-close" aria-label="Close game">
      <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
    <iframe id="viewerFrame" class="viewer-frame" title="Game player" allow="fullscreen" referrerpolicy="no-referrer"></iframe>
  </div>

  <!-- Scripts -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js" referrerpolicy="no-referrer" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/vanta@0.5.24/dist/vanta.fog.min.js" referrerpolicy="no-referrer" defer></script>
  <script>
  (() => {
    /* ── Vanta ───────────────────────────────────────────────────── */
    window.addEventListener('load', () => {
      if (window.VANTA?.FOG) {
        VANTA.FOG({
          el: '#vanta', mouseControls: true, touchControls: true,
          gyroControls: false, minHeight: 200, minWidth: 200,
          highlightColor: 0x2a5570, midtoneColor: 0x132230,
          lowlightColor: 0x060e16, baseColor: 0x030a12,
          blurFactor: 0.72, speed: 0.7, zoom: 0.88
        });
      }
    });

    /* ── Stars canvas ────────────────────────────────────────────── */
    (() => {
      const cvs = document.getElementById('stars');
      const ctx = cvs.getContext('2d');
      const stars = [];
      let W, H;
      function resize() { W = cvs.width = innerWidth; H = cvs.height = innerHeight; }
      function seed() {
        stars.length = 0;
        const n = Math.min(80, Math.max(30, Math.floor(W * H / 22000)));
        for (let i = 0; i < n; i++) stars.push({ x: Math.random()*W, y: Math.random()*H, r: Math.random()*0.6+0.3, s: Math.random()*0.14+0.05, o: Math.random()*0.18+0.07, p: Math.random()*Math.PI*2 });
      }
      function draw(t) {
        ctx.clearRect(0, 0, W, H);
        for (const s of stars) {
          s.y -= s.s;
          if (s.y < 0) s.y = H + s.r;
          const a = s.o + Math.sin(t * 0.0006 + s.p) * 0.04;
          ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(160,210,240,${Math.max(0.04,a)})`; ctx.fill();
        }
        requestAnimationFrame(draw);
      }
      resize(); seed();
      window.addEventListener('resize', () => { resize(); seed(); });
      requestAnimationFrame(draw);
    })();

    /* ── Game catalogue ──────────────────────────────────────────── */
    const GAMES = [

        icon: `<svg stroke-width="2" viewBox="0 0 24 24"><path d="M12 2L3 7v5c0 5.25 3.9 10.15 9 11.35C17.1 22.15 21 17.25 21 12V7L12 2Z" fill="currentColor" stroke="none"/><path d="m9 12 2 2 4-4" stroke="rgba(3,7,12,0.7)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`
      },
      {

      },

        tag: 'FPS IO',
        icon: `<svg stroke-width="2" viewBox="0 0 24 24"><path d="M3 8h4l2-4h6l2 4h4v8H3V8Z" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="2" fill="rgba(3,7,12,0.6)" stroke="none"/></svg>`
      },
    ];

    /* ── Stagger animation delay ─────────────────────────────────── */
    function buildCards(list) {
      const grid  = document.getElementById('gamesGrid');
      const empty = document.getElementById('emptyState');
      grid.innerHTML = '';
      if (list.length === 0) { empty.style.display = 'flex'; return; }
      empty.style.display = 'none';
      list.forEach((g, i) => {
        const card = document.createElement('button');
        card.className = `game-card ${g.color}`;
        card.type = 'button';
        card.dataset.url = g.url;
        card.style.animationDelay = `${i * 40}ms`;
        card.innerHTML = `
          <div class="card-body">
            <div class="card-icon-wrap">${g.icon}</div>
            <div class="card-name">${g.name}</div>
            <div class="card-meta">
              <span class="card-tag">${g.tag}</span>
              <span class="card-arrow">→</span>
            </div>
          </div>`;
        card.addEventListener('click', () => openGame(g.url, g.name));
        grid.appendChild(card);
      });
    }
    buildCards(GAMES);

    /* ── Filter / search ─────────────────────────────────────────── */
    let activeCat = 'all', searchQuery = '';
    function applyFilter() {
      const q = searchQuery.toLowerCase();
      buildCards(GAMES.filter(g =>
        (activeCat === 'all' || g.cat === activeCat) &&
        (!q || g.name.toLowerCase().includes(q) || g.tag.toLowerCase().includes(q))
      ));
    }
    document.getElementById('cloudSearch').addEventListener('input', e => {
      searchQuery = e.target.value; applyFilter();
    });
    document.getElementById('catRow').addEventListener('click', e => {
      const pill = e.target.closest('.cat-pill');
      if (!pill) return;
      document.querySelectorAll('.cat-pill').forEach(p => p.classList.remove('active'));
      pill.classList.add('active');
      activeCat = pill.dataset.cat;
      applyFilter();
    });

    /* ── Viewer ──────────────────────────────────────────────────── */
    const viewer      = document.getElementById('viewer');
    const viewerFrame = document.getElementById('viewerFrame');
    const viewerClose = document.getElementById('viewerClose');

    function openGame(url) {
      viewerFrame.src = url;
      viewer.classList.add('open');
      viewer.setAttribute('aria-hidden', 'false');
    }
    function closeGame() {
      viewerFrame.src = '';
      viewer.classList.remove('open');
      viewer.setAttribute('aria-hidden', 'true');
    }
    viewerClose.addEventListener('click', closeGame);
    window.addEventListener('keydown', e => { if (e.key === 'Escape') closeGame(); });
  })();
  </script>
</body>
</html>
