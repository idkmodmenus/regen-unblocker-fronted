<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Games</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background: #030304;
      overflow-x: hidden;
      font-family: 'Inter', sans-serif;
    }
    body { position: relative; }
    #bg-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      background: #030304;
      pointer-events: none;
      z-index: 0;
    }
    .glow-orb {
      position: fixed;
      width: 650px;
      height: 650px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(162, 98, 247, 0.16) 0%, rgba(0, 0, 0, 0) 70%);
      pointer-events: none;
      z-index: 1;
      animation: pulseGlow 8s ease-in-out infinite alternate;
    }
    .app-shell {
      position: relative;
      z-index: 2;
      width: min(1180px, calc(100% - 40px));
      min-height: 100vh;
      margin: 0 auto;
      padding: 120px 0 52px;
    }
    .cloud-title {
      margin-bottom: 2.5rem;
      color: #fff;
      font-size: 3.5rem;
      font-weight: 700;
      letter-spacing: -0.04em;
      text-align: center;
      text-shadow: 0 0 35px rgba(187, 134, 252, 0.3);
    }
    .cloud-title-accent {
      background: linear-gradient(135deg, #d3a4ff 0%, #a262f7 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(245px, 280px));
      justify-content: center;
      gap: 18px;
    }
    .game-card {
      position: relative;
      display: flex;
      min-height: 180px;
      overflow: hidden;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255, 255, 255, 0.17);
      border-radius: 15px;
      background: #181818;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.25);
      color: #fff;
      cursor: pointer;
      font: inherit;
      transition: transform 180ms ease, border-color 180ms ease, box-shadow 180ms ease;
    }
    .game-card:hover,
    .game-card:focus-visible {
      border-color: #b886fc;
      box-shadow: 0 20px 50px rgba(162, 98, 247, 0.2);
      outline: none;
      transform: translateY(-5px);
    }
    .game-info {
      display: block;
    }
    .game-title {
      font-size: 1.1rem;
      font-weight: 700;
    }
    .iframe-overlay {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: none;
      background: #000;
    }
    .iframe-overlay.is-open { display: block; }
    .game-frame {
      width: 100%;
      height: 100%;
      border: 0;
      background: #000;
    }
    .close-frame {
      position: absolute;
      top: 14px;
      right: 18px;
      z-index: 1;
      width: 38px;
      height: 38px;
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 50%;
      background: rgba(20, 20, 20, 0.82);
      color: #fff;
      cursor: pointer;
      font-size: 1.35rem;
      line-height: 1;
    }
    @media (max-width: 620px) {
      .app-shell { width: min(100% - 28px, 420px); padding-top: 90px; }
      .games-grid { grid-template-columns: 1fr; }
    }
    @keyframes pulseGlow {
      0% { transform: translate(-50%, -50%) scale(0.8); opacity: 0.6; }
      100% { transform: translate(-50%, -50%) scale(1.3); opacity: 1; }
    }
  </style>
</head>
<body>
  <canvas id="bg-canvas"></canvas>
  <div class="glow-orb"></div>

  <main class="app-shell">
    <h1 class="cloud-title">welcome to <span class="cloud-title-accent">Regen Cloud</span></h1>
    <section class="games-grid" id="games-grid" aria-label="Games"></section>
  </main>

  <div class="iframe-overlay" id="iframe-overlay" aria-hidden="true">
    <button class="close-frame" id="close-frame" type="button" aria-label="Close game">&times;</button>
    <iframe class="game-frame" id="game-frame" title="Game player" allow="fullscreen"></iframe>
  </div>

  <script>
    const proxyBase = 'https://camp-doe-heroes-accent.trycloudflare.com/ixl/';

    const games = [
      {
        name: 'Roblox',
        url: 'https://nowgg.fun/apps/a/19900/b.html'
      },
      {
        name: 'Android VM',
        url: 'https://nowgg.fun/apps/uncube/7074/now.html'
      }
    ];

    const gamesGrid = document.getElementById('games-grid');
    gamesGrid.innerHTML = games.map((game) => `
      <button class="game-card" type="button" data-url="${game.url}">
        <span class="game-info">
          <span class="game-title">${game.name}</span>
        </span>
      </button>
    `).join('');

    const iframeOverlay = document.getElementById('iframe-overlay');
    const gameFrame = document.getElementById('game-frame');
    const closeFrame = document.getElementById('close-frame');

    function closeGame() {
      iframeOverlay.classList.remove('is-open');
      iframeOverlay.setAttribute('aria-hidden', 'true');
      gameFrame.src = '';
    }

    gamesGrid.addEventListener('click', (event) => {
      const gameButton = event.target.closest('.game-card');
      if (!gameButton) return;
      gameFrame.src = proxyBase + gameButton.dataset.url;
      iframeOverlay.classList.add('is-open');
      iframeOverlay.setAttribute('aria-hidden', 'false');
    });

    closeFrame.addEventListener('click', closeGame);
    window.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') closeGame();
    });

    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    let mouse = { x: null, y: null, radius: 220 };

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    window.addEventListener('mousemove', (event) => {
      mouse.x = event.x;
      mouse.y = event.y;
    });

    window.addEventListener('mouseout', () => {
      mouse.x = null;
      mouse.y = null;
    });

    class Particle {
      constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 0.7 + 0.7;
        this.vx = (Math.random() - 0.5) * 0.3;
        this.vy = (Math.random() - 0.5) * 0.3;
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;

        if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
        if (this.y < 0 || this.y > canvas.height) this.vy *= -1;

        if (mouse.x && mouse.y) {
          const dx = mouse.x - this.x;
          const dy = mouse.y - this.y;
          const distance = Math.sqrt(dx * dx + dy * dy);
          if (distance < mouse.radius) {
            const force = (mouse.radius - distance) / mouse.radius;
            this.x -= (dx / distance) * force * 2;
            this.y -= (dy / distance) * force * 2;
          }
        }
      }

      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(211, 164, 255, 0.75)';
        ctx.fill();
      }
    }

    function initParticles() {
      particles = [];
      const count = Math.floor((canvas.width * canvas.height) / 12000);
      for (let i = 0; i < count; i++) {
        particles.push(new Particle());
      }
    }
    initParticles();
    window.addEventListener('resize', initParticles);

    function connectParticles() {
      for (let i = 0; i < particles.length; i++) {
        for (let j = i + 1; j < particles.length; j++) {
          const dx = particles[i].x - particles[j].x;
          const dy = particles[i].y - particles[j].y;
          const distance = Math.sqrt(dx * dx + dy * dy);

          if (distance < 115) {
            const opacity = (1 - distance / 115) * 0.12;
            ctx.strokeStyle = `rgba(187, 134, 252, ${opacity})`;
            ctx.lineWidth = 0.6;
            ctx.beginPath();
            ctx.moveTo(particles[i].x, particles[i].y);
            ctx.lineTo(particles[j].x, particles[j].y);
            ctx.stroke();
          }
        }
      }
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach((particle) => {
        particle.update();
        particle.draw();
      });
      connectParticles();
      requestAnimationFrame(animate);
    }
    animate();
  </script>
</body>
</html>
